name: Auth State Sync v2
on:
  push:
    paths:
      - 'auth-state-sync-v2.trigger'
      - '.github/workflows/auth-state-sync-v2.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix auth shortcut state detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''const refresh=()=>{\n   const profile=window.state?.profile;\n   const isAdmin=typeof window.isAdmin==='function'&&window.isAdmin();\n   if(login) login.classList.toggle('hidden',!!profile);\n   if(upload) upload.classList.toggle('hidden',!isAdmin);\n   if(admin) admin.classList.toggle('hidden',!isAdmin);\n   if(profile&&login) login.textContent='已登录';\n };'''
          new='''const refresh=()=>{\n   const loggedIn=!!document.querySelector('.rolebar.show');\n   const adminMode=!!document.querySelector('.adminbar.show');\n   if(login){login.classList.toggle('hidden',loggedIn);login.textContent='登录';}\n   if(upload) upload.classList.toggle('hidden',!adminMode);\n   if(admin) admin.classList.toggle('hidden',!adminMode);\n };'''
          if old in s:
              s=s.replace(old,new,1)
          else:
              import re
              s=re.sub(r"const refresh=\(\)=>\{.*?\n \};",new,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit auth state fix
        run: |
          rm -f auth-state-sync-v2.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html auth-state-sync-v2.trigger
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix auth shortcut state synchronization'
          git push origin main
