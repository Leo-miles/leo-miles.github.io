name: Auth Profile Repair
on:
  push:
    paths:
      - 'auth-profile-repair.trigger'
      - '.github/workflows/auth-profile-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair login/profile state in frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""async function loadProfile(u){if(!u){state.profile=null;return}let{data,error}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(error)throw error;state.profile=data||null}"""
          new="""async function loadProfile(u){\n  if(!u){state.profile=null;state.profileError=null;return}\n  state.profileError=null;\n  let{data,error}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();\n  if(error){\n    console.error('profiles load failed',error);\n    state.profileError=error;\n    const uname=u.user_metadata?.username||((u.email||'').split('@')[0]||'用户');\n    state.profile={id:u.id,username:uname,role:'user',muted:false,note:null,created_at:null};\n    return\n  }\n  if(!data){\n    const uname=u.user_metadata?.username||((u.email||'').split('@')[0]||'用户');\n    state.profile={id:u.id,username:uname,role:'user',muted:false,note:null,created_at:null};\n    state.profileMissing=true;\n    return\n  }\n  state.profileMissing=false;\n  state.profile=data\n}"""
          if old not in s: raise SystemExit('loadProfile target not found')
          s=s.replace(old,new,1)
          old2="""function renderNav(){if(!state.profile){$('#navActions').innerHTML='<button class=\"btn\" id=\"loginBtn\">登录</button><button class=\"btn primary\" id=\"regBtn\">注册</button>'}else{let rc=state.profile.role===ROLE.SUPER?'role-super':state.profile.role===ROLE.ADMIN?'role-admin':'';$('#navActions').innerHTML=`<button class=\"btn\">${esc(state.profile.nickname||state.profile.username)} <span class=\"badge ${rc}\">${roleText(state.profile.role)}</span></button><button class=\"btn\" id=\"logoutBtn\">退出</button>`;$('#logoutBtn').onclick=async()=>{let{error}=await sb.auth.signOut();if(error)toast(error.message,true)}}$('#loginBtn')?.addEventListener('click',openLogin);$('#regBtn')?.addEventListener('click',openRegister);$('#adminbar').classList.toggle('show',isAdmin());if(isAdmin()){$('#adminWelcome').textContent=(state.profile.nickname||state.profile.username)+' · '+roleText(state.profile.role);$('#adminHint').textContent=isSuper()?'完整管理权限：产品、用户、留言与删除产品':'产品管理权限：新增、修改及留言处理';$('#userManageBtn').style.display=isSuper()?'':'none'}}"""
          new2="""function renderNav(){\n  if(!state.user){\n    $('#navActions').innerHTML='<button class=\"btn\" id=\"loginBtn\">登录</button><button class=\"btn primary\" id=\"regBtn\">注册</button>'\n  }else{\n    let rc=state.profile?.role===ROLE.SUPER?'role-super':state.profile?.role===ROLE.ADMIN?'role-admin':'';\n    let label=state.profile?.nickname||state.profile?.username||((state.user.email||'').split('@')[0]||'用户');\n    let role=state.profile?.role||'user';\n    $('#navActions').innerHTML=`<button class=\"btn\">${esc(label)} <span class=\"badge ${rc}\">${roleText(role)}</span></button><button class=\"btn\" id=\"logoutBtn\">退出</button>`;\n    $('#logoutBtn').onclick=async()=>{let{error}=await sb.auth.signOut();if(error)toast(error.message,true)}\n  }\n  $('#loginBtn')?.addEventListener('click',openLogin);$('#regBtn')?.addEventListener('click',openRegister);\n  $('#adminbar').classList.toggle('show',isAdmin());\n  if(isAdmin()){\n    $('#adminWelcome').textContent=(state.profile?.nickname||state.profile?.username)+' · '+roleText(state.profile.role);\n    $('#adminHint').textContent=isSuper()?'完整管理权限：产品、用户、留言与删除产品':'产品管理权限：新增、修改及留言处理';\n    $('#userManageBtn').style.display=isSuper()?'':'none'\n  }\n}"""
          if old2 not in s: raise SystemExit('renderNav target not found')
          s=s.replace(old2,new2,1)
          old3="""const loggedIn=!!document.querySelector('.rolebar.show');"""
          new3="""const loggedIn=!!document.querySelector('#logoutBtn');"""
          s=s.replace(old3,new3,1)
          old4="""if(login){login.classList.toggle('hidden',loggedIn);login.textContent='登录';}"""
          new4="""if(login){login.classList.toggle('hidden',loggedIn);login.textContent=loggedIn?'已登录':'登录';}"""
          s=s.replace(old4,new4,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check <(python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/all.js').write_text('\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')
          print(Path('/tmp/all.js').read_text(encoding='utf-8'))
          PY
          )
      - name: Commit frontend repair
        run: |
          rm -f auth-profile-repair.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html auth-profile-repair.trigger
          git diff --cached --quiet && exit 0
          git commit -m 'Repair login state and profile fallback'
          git push origin main