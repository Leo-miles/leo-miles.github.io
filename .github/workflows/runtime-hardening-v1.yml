name: Runtime Hardening V1
on:
  push:
    paths:
      - 'runtime-hardening-v1.trigger'
      - '.github/workflows/runtime-hardening-v1.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let state={user:null,profile:null,products:[],q:'',cat:'all',editingId:null,commentProduct:null,pendingImages:[],pendingVideo:null};", "let state={user:null,profile:null,products:[],q:'',cat:'all',editingId:null,commentProduct:null,pendingImages:[],pendingVideo:null,adminNicknames:{}};window.state=state;", 1)
          s=s.replace("function renderHero(){let n=state.products.length;", "function renderHero(){if(!document.querySelector('#heroEyebrow')||!document.querySelector('#heroTitle')||!document.querySelector('#heroText')||!document.querySelector('#heroStats'))return;let n=state.products.length;", 1)
          s=s.replace("selling:old?.selling||''", "selling:q('#pSelling').value.trim()", 1)
          p.write_text(s,encoding='utf-8')
          # Canonical database contract checks.
          bad=[]
          if 'selling:old?.selling||' in s: bad.append('selling-save')
          if 'function renderHero(){let n=' in s: bad.append('hero-crash')
          if 'window.state=state;' not in s: bad.append('window-state')
          if not re.search(r'price:pb\?String\(calcTotal\(\)\):String\(Number\(q\(\'#pPrice\'\)\.value\|\|0\)\),description:',s): bad.append('description-write')
          if bad: raise SystemExit('checks failed: '+','.join(bad))
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          Path('/tmp/page.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/page.js
          grep -q 'window.state=state;' index.html
          grep -q "selling:q('#pSelling').value.trim()" index.html
          grep -q 'description:JSON.stringify(legacy)' index.html
      - name: Align schema file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/schema.sql')
          s=p.read_text(encoding='utf-8')
          s=s.replace('returns public.user_role language sql immutable as $$','returns public.user_role language sql immutable set search_path=public as $$',1)
          if "('powerbank','充电宝'" not in s:
              s=s.replace("('electronics','电子产品','▣','消费电子与小家电',20),", "('electronics','电子产品','▣','消费电子与小家电',20),\n('powerbank','充电宝','▰','移动电源与储能产品',25),",1)
          s=s.replace('  description text,','  description text,',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and cleanup
        run: |
          rm -f runtime-hardening-v1.trigger .github/workflows/runtime-hardening-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: finalize runtime and database contract'
          git push origin main
