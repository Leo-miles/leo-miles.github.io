name: Auth publish hardening v3
on:
  push:
    paths:
      - '.github/workflows/auth-publish-hardening-v3.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject deterministic auth and save fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PI_AUTH_PUBLISH_HARDENING_V3 -->'
          if marker not in s:
              code=r'''<script id="pi-auth-publish-hardening-v3">
(() => {
  const bootFix = () => {
    try {
      if (typeof q !== 'function' || typeof sb === 'undefined') return;
      const loginBtn=q('#loginSubmit');
      if(loginBtn){
        loginBtn.onclick=async()=>{
          const name=(q('#loginName')?.value||'').trim().toLowerCase();
          const pwd=q('#loginPwd')?.value||'';
          const status=q('#loginStatus');
          if(!name||!pwd){if(status)status.textContent='请输入用户名和密码';return}
          const email=name.includes('@')?name:(name+'@accounts.leo-product-center.invalid');
          if(status)status.textContent='正在验证…';
          try{
            const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});
            if(error) throw error;
            state.user=data.user;
            await loadProfile();
            await loadProducts();
            renderNav();renderRole();renderSection();renderAll();
            closeModal('loginModal');
            if(typeof toast==='function')toast('登录成功');
          }catch(e){
            console.error('[AUTH]',e);
            if(status)status.textContent='登录失败：'+(e?.message||'账号或密码错误');
          }
        };
      }
      const saveBtn=q('#saveProductBtn');
      if(saveBtn){
        saveBtn.addEventListener('click',()=>{setTimeout(()=>{
          const st=q('#productStatus');
          if(st && /失败|错误|error/i.test(st.textContent||'')) console.error('[PRODUCT]',st.textContent);
        },1200)},true);
      }
      if(typeof renderNav==='function') renderNav();
    }catch(e){console.error('[HARDENING]',e)}
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootFix);else bootFix();
})();
</script>
<!-- PI_AUTH_PUBLISH_HARDENING_V3 -->'''
              anchor='</script>\n<script id="pi-apple-home-v3-js">'
              if anchor not in s:
                  raise SystemExit('ANCHOR_NOT_FOUND')
              s=s.replace(anchor, '</script>\n'+code+'\n<script id="pi-apple-home-v3-js">', 1)
          p.write_text(s,encoding='utf-8')
          print('hardening injected',len(s))
          PY
      - name: Syntax sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'pi-auth-publish-hardening-v3' in s
          assert "sb.auth.signInWithPassword({email,password:pwd})" in s
          print('OK')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'harden browser auth session and publish flow'
          git push
          rm -f .github/workflows/auth-publish-hardening-v3.yml
          git add -u .github/workflows/auth-publish-hardening-v3.yml
          git commit -m 'remove temporary hardening workflow'
          git push