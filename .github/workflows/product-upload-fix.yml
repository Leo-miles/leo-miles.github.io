name: Product Upload Compatibility Fix
on:
  push:
    paths:
      - 'product-upload-fix.trigger'
      - '.github/workflows/product-upload-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch product save logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""      const payload={name,model:q('#pModel').value.trim(),category:cat,price:pb?null:Number(q('#pPrice').value||0),description:JSON.stringify(extra),kit_price:pb?Number(q('#pKitPrice').value||0):0,cell_model:pb?q('#pCellModel').value.trim():null,cell_count:pb?Number(q('#pCellCount').value||0):0,actual_cell_capacity:pb?Number(q('#pActualCellCapacity').value||0):0,cell_price:pb?Number(q('#pCellPrice').value||0):0,assembly_fee:pb?Number(q('#pAssemblyFee').value||0):0,other_cost:pb?Number(q('#pOtherCost').value||0):0,total_cost:pb?calcTotal():0,specs:q('#pSpecs').value.trim(),selling:old?.selling||'',updated_at:new Date().toISOString()};"""
          new="""      const legacy={supplier:extra.supplier,priceComposition:extra.priceComposition,moq:extra.moq,delivery:extra.delivery,carton:extra.carton,maxOutputPower:extra.maxOutputPower,kitPrice:pb?Number(q('#pKitPrice').value||0):0,cellModel:pb?q('#pCellModel').value.trim():'',cellCount:pb?Number(q('#pCellCount').value||0):0,actualCellCapacity:pb?Number(q('#pActualCellCapacity').value||0):0,cellPrice:pb?Number(q('#pCellPrice').value||0):0,assemblyFee:pb?Number(q('#pAssemblyFee').value||0):0,otherCost:pb?Number(q('#pOtherCost').value||0):0,totalCost:pb?calcTotal():0};\n      const payload={name,model:q('#pModel').value.trim(),category:cat,price:pb?String(calcTotal()):String(Number(q('#pPrice').value||0)),desc:JSON.stringify(legacy),specs:q('#pSpecs').value.trim(),selling:old?.selling||'',published:true,created_by:state.user.id,updated_at:new Date().toISOString()};"""
          if old not in s:
              raise SystemExit('product payload target not found')
          s=s.replace(old,new,1)
          old2="""const nick=getAdminNickname(state.user.id)||state.profile.username;const r=await sb.from('products').insert({...payload,published:true,created_by:state.user.id,uploader_nickname:nick}).select().single();if(r.error)throw r.error;id=r.data.id"""
          new2="""const r=await sb.from('products').insert(payload).select().single();if(r.error)throw r.error;id=r.data.id"""
          if old2 not in s:
              raise SystemExit('product insert target not found')
          s=s.replace(old2,new2,1)
          old3="""function getExtra(p){try{return JSON.parse(p?.description||'{}')||{}}catch{return{}}}"""
          new3="""function getExtra(p){try{return JSON.parse(p?.desc||p?.description||'{}')||{}}catch{return{}}}"""
          if old3 not in s:
              raise SystemExit('getExtra target not found')
          s=s.replace(old3,new3,1)
          old4="""const role=state.profile?.role||'user';"""
          new4="""const role=state.profile?.role||'user';"""
          s=s.replace(old4,new4,1)
          old5="""q('#price').textContent"""
          # no-op marker to keep patch deterministic
          s=s.replace("uploader_nickname:p.uploader_nickname","uploader_nickname:p.uploader_nickname")
          p.write_text(s,encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          Path('/tmp/index-js.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/index-js.js
      - name: Commit product upload compatibility fix
        run: |
          rm -f product-upload-fix.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html product-upload-fix.trigger
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix product upload for current Supabase schema'
          git push origin main
