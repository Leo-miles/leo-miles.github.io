name: Fix admin nickname helper

on:
  push:
    branches: [main]
    paths:
      - "fix-admin-nickname.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* PI_ADMIN_NICKNAME_HELPER_V1 */'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          target="function esc(s){"
          helper="""/* PI_ADMIN_NICKNAME_HELPER_V1 */\nfunction getAdminNickname(id){try{if(!id)return '';return state.adminNicknames?.[id]||''}catch{return ''}}\n"""
          if target not in s:
              raise SystemExit('target function not found')
          s=s.replace(target,helper+target,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove one-shot files
        run: |
          rm -f fix-admin-nickname.trigger .github/workflows/fix-admin-nickname.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fix-admin-nickname.trigger .github/workflows/fix-admin-nickname.yml
          git commit -m "fix: define admin nickname helper" || exit 0
          git push
