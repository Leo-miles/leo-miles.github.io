name: Check copy fix deployment
on:
  push:
    paths:
      - '.github/workflows/check-copy-fix.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify copy handler
        run: |
          grep -q "资料和.*张图片已复制" index.html
          grep -q "ClipboardItem" index.html
      - name: Remove checker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/check-copy-fix.yml
          git commit -m 'chore: remove copy fix checker'
          git push origin main
