name: Verify image copy update
on:
  push:
    paths:
      - '.github/workflows/verify-copy-fix.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          grep -q "ClipboardItem" index.html
          grep -q "资料和" index.html
      - name: Cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-copy-fix.yml
          git commit -m 'chore: remove verification workflow' || exit 0
          git push origin main
