name: Safe Repair Existing JavaScript Syntax
on:
  push:
    paths:
      - 'fix-syntax.trigger'
      - '.github/workflows/fix-syntax-v1.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair known syntax typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("`装箱规格：${x.carton||'—'`)","`装箱规格：${x.carton||'—'}`)")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          Path('/tmp/pi.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/pi.js
      - name: Commit repair
        run: |
          rm -f fix-syntax.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html fix-syntax.trigger
          git diff --cached --quiet && exit 0 || true
          git commit -m 'Repair existing JavaScript template syntax'
          git push
