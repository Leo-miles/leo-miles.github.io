name: Final auth publish v4
on:
  push:
    paths:
      - '.github/workflows/final-auth-publish-v4.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main app scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove the broken out-of-scope fallback block.
          start=s.find('<script id="pi-auth-publish-hardening-v3">')
          if start>=0:
              end=s.find('<!-- PI_AUTH_PUBLISH_HARDENING_V3 -->',start)
              if end<0: raise SystemExit('BROKEN_BLOCK_END_NOT_FOUND')
              end=s.find('</script>',end)
              if end<0: raise SystemExit('BROKEN_SCRIPT_END_NOT_FOUND')
              end+=len('</script>')
              s=s[:start]+s[end:]
          marker='// PI_AUTH_PUBLISH_V4'
          if marker not in s:
              anchor="  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();"
              inject="""  // PI_AUTH_PUBLISH_V4\n  const installAuthPublishFallback=()=>{\n    try{\n      const loginBtn=q('#loginSubmit');\n      if(loginBtn){loginBtn.onclick=async()=>{\n        const raw=(q('#loginName')?.value||'').trim().toLowerCase(),pwd=q('#loginPwd')?.value||'',st=q('#loginStatus');\n        if(!raw||!pwd){if(st)st.textContent='请输入用户名和密码';return}\n        const email=raw.includes('@')?raw:`${raw}@accounts.leo-product-center.invalid`;\n        if(st)st.textContent='正在验证…';\n        try{\n          const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});\n          if(error)throw error;\n          state.user=data.user;\n          await loadProfile();\n          await loadProducts();\n          renderNav();renderRole();renderSection();renderAll();\n          closeModal('loginModal');\n          toast('登录成功');\n        }catch(e){console.error('[AUTH]',e);if(st)st.textContent='登录失败：'+(e?.message||'账号或密码错误')}\n      }}\n      const saveBtn=q('#saveProductBtn');\n      if(saveBtn){saveBtn.onclick=async()=>{\n        if(!state.user){openModal('loginModal');return}\n        if(!isAdmin()){toast('当前账号没有产品发布权限',true);return}\n        const old=state.editingId?state.products.find(x=>x.id===state.editingId):null;\n        const name=q('#pName')?.value.trim();\n        if(!name){toast('请填写产品名称',true);return}\n        const payload={name,model:q('#pModel')?.value.trim()||null,category:q('#pCategory')?.value||null,price:q('#pPrice')?.value.trim()||null,description:JSON.stringify({supplier:q('#pSupplier')?.value.trim()||'',priceComposition:q('#pPriceComposition')?.value.trim()||'',moq:q('#pMOQ')?.value.trim()||'',delivery:q('#pDelivery')?.value.trim()||'',carton:q('#pCarton')?.value.trim()||'',maxOutputPower:q('#pMaxOutputPower')?.value.trim()||'',kitPrice:q('#pKitPrice')?.value||'',cellModel:q('#pCellModel')?.value.trim()||'',cellCount:q('#pCellCount')?.value||'',actualCellCapacity:q('#pActualCellCapacity')?.value||'',cellPrice:q('#pCellPrice')?.value||'',assemblyFee:q('#pAssemblyFee')?.value||'',otherCost:q('#pOtherCost')?.value||'',totalCost:q('#pTotalCostPreview')?.textContent?.replace(/[^0-9.]/g,'')||'0'}),specs:q('#pSpecs')?.value.trim()||'',selling:q('#pSelling')?.value.trim()||'',published:true,updated_at:new Date().toISOString()};\n        try{\n          let r;\n          if(old) r=await sb.from('products').update(payload).eq('id',old.id).select().single();\n          else r=await sb.from('products').insert({...payload,created_by:state.user.id}).select().single();\n          if(r.error)throw r.error;\n          state.editingId=r.data.id;\n          // Upload pending media after the product row exists.\n          if(typeof uploadPendingMedia==='function')await uploadPendingMedia(r.data.id);\n          await loadProducts();renderAll();closeModal('productModal');toast(old?'产品已更新并发布':'产品已发布');\n        }catch(e){console.error('[PRODUCT_SAVE]',e);toast('发布失败：'+(e?.message||'数据库写入失败'),true)}\n      }}\n    }catch(e){console.error('[V4]',e)}\n  };\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',installAuthPublishFallback);else installAuthPublishFallback();\n"""
              if anchor not in s: raise SystemExit('ANCHOR_NOT_FOUND')
              s=s.replace(anchor,inject+anchor,1)
          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY
      - name: Validate markers and JavaScript structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'PI_AUTH_PUBLISH_V4' in s
          assert 'sb.auth.signInWithPassword({email,password:pwd})' in s
          assert 'created_by:state.user.id' in s
          assert "selling:q('#pSelling')?.value.trim()||''" in s
          assert 'pi-auth-publish-hardening-v3' not in s
          print('FINAL_PATCH_OK')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'finalize auth session and product publishing' || true
          git push
          rm -f .github/workflows/final-auth-publish-v4.yml
          git add -u .github/workflows/final-auth-publish-v4.yml
          git commit -m 'remove temporary auth publish workflow'
          git push