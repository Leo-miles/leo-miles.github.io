name: Apple Style Homepage v3
on:
  push:
    paths:
      - 'apple-home-v3.trigger'
      - '.github/workflows/apple-home-v3.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust homepage redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<!-- PI_APPLE_HOME_V3 -->' not in s:
              css="""\n<!-- PI_APPLE_HOME_V3 -->\n<style id="pi-apple-home-v3">\n:root{--a-bg:#f5f5f7;--a-text:#1d1d1f;--a-muted:#6e6e73;--a-line:#d2d2d7}\nbody{background:var(--a-bg);color:var(--a-text)}\n.pi-apple{position:relative;overflow:hidden;border-radius:34px;min-height:650px;margin:0 0 26px;background:#050505;color:#fff;box-shadow:0 30px 90px rgba(0,0,0,.18);isolation:isolate}.pi-apple:before{content:\"\";position:absolute;inset:0;background:radial-gradient(circle at 72% 25%,rgba(0,113,227,.36),transparent 25%),radial-gradient(circle at 24% 80%,rgba(112,76,255,.18),transparent 28%),linear-gradient(135deg,#020202,#141519 58%,#050505);z-index:-3}.pi-apple-grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:54px 54px;transform:perspective(900px) rotateX(63deg) translateY(26%);mask-image:radial-gradient(circle at center,#000 26%,transparent 76%);opacity:.42;z-index:-2}.pi-apple-orb{position:absolute;width:500px;height:500px;right:-100px;top:50%;transform:translateY(-50%);border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 90px rgba(0,113,227,.18),inset 0 0 100px rgba(90,150,255,.08);transition:transform .18s ease-out}.pi-apple-orb:before{content:\"\";position:absolute;inset:9%;border:1px solid rgba(255,255,255,.08);border-radius:50%}.pi-apple-orb:after{content:\"\";position:absolute;inset:23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.12),transparent 46%),rgba(0,113,227,.08);box-shadow:0 0 80px rgba(0,113,227,.24)}.pi-apple-ring{position:absolute;inset:17%;border-radius:50%;border:1px solid rgba(255,255,255,.09);animation:piAppleSpin 18s linear infinite}.pi-apple-ring:after{content:\"\";position:absolute;right:7%;top:18%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 16px #fff}@keyframes piAppleSpin{to{transform:rotate(360deg)}}\n.pi-apple-copy{position:relative;z-index:2;padding:90px 8%;max-width:900px;transition:transform .18s ease-out}.pi-apple-kicker{font-size:12px;letter-spacing:.18em;color:#a1a1a6;margin-bottom:20px}.pi-apple-title{font-size:clamp(48px,7vw,92px);line-height:.98;letter-spacing:-.06em;margin:0;background:linear-gradient(#fff,#bfc1c7);-webkit-background-clip:text;background-clip:text;color:transparent}.pi-apple-sub{max-width:650px;margin:24px 0 0;color:#a7a9ae;font-size:18px;line-height:1.55}.pi-apple-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.pi-apple-btn{border:0;border-radius:999px;padding:13px 21px;font-weight:700;font-size:14px;transition:.22s}.pi-apple-btn:hover{transform:translateY(-2px)}.pi-apple-main{background:#fff;color:#111}.pi-apple-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14)}.pi-apple-note{display:flex;gap:18px;flex-wrap:wrap;margin-top:27px;color:#888b91;font-size:11px}.pi-apple-note span{display:inline-flex;align-items:center;gap:7px}.pi-apple-dot{width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 14px rgba(48,209,88,.65)}.pi-apple-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 32px}.pi-apple-metric{background:#fff;border:1px solid var(--a-line);border-radius:25px;padding:27px;min-height:160px;transition:.28s}.pi-apple-metric:hover{transform:translateY(-5px);box-shadow:0 20px 48px rgba(0,0,0,.08)}.pi-apple-metric small{color:var(--a-muted);font-size:11px}.pi-apple-metric strong{display:block;font-size:38px;letter-spacing:-.04em;margin-top:26px}.pi-apple-metric span{display:block;color:var(--a-muted);font-size:12px;margin-top:4px}.pi-apple-section{margin:5px 0 14px}.pi-apple-section h2{font-size:32px;letter-spacing:-.04em;margin:0}.pi-apple-section p{margin:4px 0 0;color:var(--a-muted);font-size:12px}.catalog .card{border-radius:24px;overflow:hidden;transition:transform .35s,box-shadow .35s}.catalog .card:hover{transform:translateY(-7px);box-shadow:0 28px 58px rgba(0,0,0,.12)}.catalog .cover{height:285px;overflow:hidden;background:#ededf0}.catalog .cover img{transition:transform .55s cubic-bezier(.2,.65,.2,1)}.catalog .card:hover .cover img{transform:scale(1.045)}.catalog .body{padding:18px}.catalog .body h3{font-size:21px;letter-spacing:-.02em}.catalog .pc-actions .mini{border-radius:999px}@media(max-width:900px){.pi-apple{min-height:590px}.pi-apple-copy{padding:65px 25px}.pi-apple-orb{right:-275px;opacity:.6}.pi-apple-title{font-size:54px}.pi-apple-sub{font-size:16px}.pi-apple-metrics{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.pi-apple-ring{animation:none}.pi-apple-orb,.pi-apple-copy,.pi-apple-btn,.pi-apple-metric,.catalog .card,.catalog .cover img{transition:none}}\n</style>\n"""
              s=s.replace('</head>',css+'</head>',1)
          m=re.search(r'<section\b[^>]*\bclass=[\"\']hero[\"\'][^>]*>[\s\S]*?</section>',s,re.I)
          if not m:
              m=re.search(r'<section\b[^>]*class=[\"\'][^\"\']*hero[^\"\']*[\"\'][^>]*>[\s\S]*?</section>',s,re.I)
          if not m: raise SystemExit('hero section not found')
          home="""<section class="pi-apple" id="piAppleHome"><div class="pi-apple-grid"></div><div class="pi-apple-orb"><div class="pi-apple-ring"></div></div><div class="pi-apple-copy"><div class="pi-apple-kicker">PRODUCT INTELLIGENCE HUB · ONLINE</div><h1 class="pi-apple-title">新品资料，<br>一眼找到。</h1><p class="pi-apple-sub">产品、参数、图片、视频与卖点，集中在一个更清晰、更快速的产品工作空间。浏览产品资料无需登录。</p><div class="pi-apple-actions"><button class="pi-apple-btn pi-apple-main" id="piAppleExplore">进入产品智库　↗</button><button class="pi-apple-btn pi-apple-ghost" id="piAppleLatest">探索新品</button></div><div class="pi-apple-note"><span><i class="pi-apple-dot"></i>DATA LINK ONLINE</span><span>访客模式 · 可直接浏览</span></div></div></section><div class="pi-apple-metrics"><div class="pi-apple-metric"><small>PRODUCTS</small><strong id="piAppleProducts">—</strong><span>产品资料</span></div><div class="pi-apple-metric"><small>CATEGORIES</small><strong id="piAppleCategories">—</strong><span>产品分类</span></div><div class="pi-apple-metric"><small>ACCESS</small><strong>OPEN</strong><span>无需登录即可浏览</span></div></div><div class="pi-apple-section"><h2>探索产品</h2><p>像使用 Apple 产品一样，快速找到需要的资料。</p></div>"""
          s=s[:m.start()]+home+s[m.end():]
          script="""<script id="pi-apple-home-v3-js">(()=>{const q=s=>document.querySelector(s);const h=q('#piAppleHome'),o=h?.querySelector('.pi-apple-orb'),c=h?.querySelector('.pi-apple-copy'),p=q('#piAppleProducts'),k=q('#piAppleCategories');function u(){try{const a=Array.isArray(window.state?.products)?window.state.products:[];p&&(p.textContent=a.length);k&&(k.textContent=new Set(a.map(x=>x.category).filter(Boolean)).size)}catch(e){}}h?.addEventListener('mousemove',e=>{const r=h.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;o&&(o.style.transform=`translateY(-50%) translate(${x*18}px,${y*12}px)`);c&&(c.style.transform=`translate(${x*-4}px,${y*-3}px)`)});h?.addEventListener('mouseleave',()=>{o&&(o.style.transform='translateY(-50%)');c&&(c.style.transform='none')});q('#piAppleExplore')?.addEventListener('click',()=>document.querySelector('.layout')?.scrollIntoView({behavior:'smooth',block:'start'}));q('#piAppleLatest')?.addEventListener('click',()=>document.querySelector('.catalog')?.scrollIntoView({behavior:'smooth',block:'start'}));document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();q('.search input')?.focus()}});setTimeout(u,900);setInterval(u,3000)})();</script>"""
          if 'id="pi-apple-home-v3-js"' not in s:
              s=s.replace('</body>',script+'\n</body>',1)
          s=s.replace('state.profile.nickname || state.profile.username','(getAdminNickname(state.profile.id)||state.profile.username)',1)
          s=s.replace('u.nickname||u.username','(getAdminNickname(u.id)||u.username)')
          p.write_text(s,encoding='utf-8')
          # Validate all inline JS blocks
          s2=p.read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s2,re.S|re.I))
          Path('/tmp/pi.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/pi.js
      - name: Commit validated homepage
        run: |
          rm -f apple-home-v3.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Redesign homepage with Apple-inspired browsing experience'
          git push
