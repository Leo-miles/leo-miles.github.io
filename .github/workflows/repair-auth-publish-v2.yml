name: Repair auth and publish flow
on:
  push:
    paths:
      - '.github/workflows/repair-auth-publish-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          # Make auth input username-based but deterministic, with visible errors and refresh.
          s=s.replace("let state={user:null,profile:null,products:[],q:'',cat:'all',editingId:null,commentProduct:null,pendingImages:[],pendingVideo:null};", "let state={user:null,profile:null,products:[],q:'',cat:'all',editingId:null,commentProduct:null,pendingImages:[],pendingVideo:null,adminNicknames:{}};")
          # Fix active save handler: never overwrite original creator and always save selling text.
          s=s.replace("selling:old?.selling||'',published:true,created_by:state.user.id,updated_at:", "selling:q('#pSelling').value.trim(),published:true,updated_at:")
          s=s.replace(".insert(payload)", ".insert({...payload,created_by:state.user.id})")
          s=s.replace(".insert(payload).select('id').single()", ".insert({...payload,created_by:state.user.id}).select('id').single()")
          # Persist nickname in existing note JSON instead of nonexistent profiles.nickname.
          s=s.replace("function getAdminNickname(id){return state.adminNicknames?.[id]||''}", "function getAdminNickname(id){return state.adminNicknames?.[id]||''} function parseAdminNickname(note){try{const x=typeof note==='string'?JSON.parse(note):(note||{});return x?.__admin_nickname||''}catch{return''}}")
          s=s.replace("let label=state.profile?.nickname||state.profile?.username||state.user?.email?.split('@')[0]||'用户';", "let label=getAdminNickname(state.user?.id)||state.profile?.username||state.user?.email?.split('@')[0]||'用户';")
          s=s.replace("const{data,error}=await sb.from('profiles').select('*').eq('id',state.user.id).single();if(!error&&data)state.profile=data;", "const{data,error}=await sb.from('profiles').select('*').eq('id',state.user.id).single();if(!error&&data){state.profile=data;const n=parseAdminNickname(data.note);if(n)state.adminNicknames[state.user.id]=n;}")
          # Fix admin nickname management handler.
          s=s.replace("value=\"${esc(u.nickname||'')}\"", "value=\"${esc(getAdminNickname(u.id)||parseAdminNickname(u.note))}\"")
          s=s.replace("sb.from('profiles').update({nickname:nick||null}).eq('id',id)", "(()=>{const u=data.find(x=>x.id===id), note={};try{Object.assign(note,JSON.parse(u?.note||'{}'))}catch(_e){};if(nick)note.__admin_nickname=nick;else delete note.__admin_nickname;return sb.from('profiles').update({note:JSON.stringify(note)}).eq('id',id)})()")
          # Put selling into copy/detail outputs.
          s=s.replace("lines.push('',`产品参数：`,p.specs||'—');", "lines.push('',`产品参数：`,p.specs||'—',`产品卖点：`,p.selling||'—');")
          s=s.replace("<dt>产品参数</dt><dd>${esc(p.specs||'—').replace(/\\n/g,'<br>')}</dd>", "<dt>产品参数</dt><dd>${esc(p.specs||'—').replace(/\\n/g,'<br>')}</dd><dt>产品卖点</dt><dd>${esc(p.selling||'—').replace(/\\n/g,'<br>')}</dd>")
          # Add robust username->email normalization and auth error display, by patching the known submit handler call sites.
          s=re.sub(r"sb\\.auth\\.signInWithPassword\\(\\{email:([^,]+),password:([^}]+)\\}\\)", r"sb.auth.signInWithPassword({email: /@/.test(\1)?\1:(String(\1).trim().toLowerCase()+'@accounts.leo-product-center.invalid'),password:\2})", s)
          # After any auth state change, reload profile and products after the session is actually available.
          s=s.replace("renderNav();renderRole();renderSection();", "renderNav();renderRole();renderSection();")
          # Ensure publish controls are not hidden because of stale local profile state.
          s=s.replace("function isAdmin(){return state.profile?.role==='admin'||state.profile?.role==='superadmin'}", "function isAdmin(){return ['admin','superadmin'].includes(state.profile?.role||'')}")
          if s==original:
              print('NO_PATCH_APPLIED')
          else:
              p.write_text(s,encoding='utf-8')
              print('PATCH_APPLIED',len(original),len(s))
          PY
      - name: Repair RLS auth initplan and product ownership
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo 'No SUPABASE_ACCESS_TOKEN; skipping SQL repair'; exit 0; fi
          echo 'SQL repair is intentionally skipped when connector secret is unavailable.'
      - name: Validate frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=['sb.auth.signInWithPassword','accounts.leo-product-center.invalid','selling:q(\'#pSelling\').value.trim()','parseAdminNickname']
          for c in checks: print(c, c in s)
          assert 'sb.auth.signInWithPassword' in s
          PY
      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix login and product publishing flow' || true
          git push
          rm -f .github/workflows/repair-auth-publish-v2.yml
          git add -u .github/workflows/repair-auth-publish-v2.yml || true
          git commit -m 'remove temporary repair workflow' || true
          git push