name: Repair copy handler
on:
  push:
    paths:
      - '.github/workflows/repair-copy-handler.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          start=s.find('window.copyProduct=async function(id){')
          if start<0: raise SystemExit('copy handler not found')
          end=s.find('};', start)
          if end<0: raise SystemExit('copy handler terminator not found')
          end += 2
          fn="""window.copyProduct=async function(id){const p=state.products.find(x=>x.id===id);if(!p)return;const x=getExtra(p),lines=[`产品名称：${p.name}`,`型号：${p.model||'—'}`,`分类：${catName(p.category)}`,`供应商：${x.supplier||'—'}`];if(p.category==='powerbank'){lines.push(`套料价格：¥${money(p.kit_price)}`,`电芯型号：${p.cell_model||'—'}`,`电芯数量：${num(p.cell_count)} 颗`,`电芯价格：¥${money(p.cell_price)} / 颗`,`组装费：¥${money(p.assembly_fee)}`,`其他费用预估：¥${money(p.other_cost)}`,`合计成本：¥${money(p.total_cost)}`,`MOQ：${x.moq||'—'}`,`最大输出功率：${x.maxOutputPower||'—'`)}else{lines.push(`产品价格：¥${money(p.price)}`,`价格构成：${x.priceComposition||'—'}`,`MOQ：${x.moq||'—'}`,`交期：${x.delivery||'—'}`,`装箱规格：${x.carton||'—'`)}lines.push('',`产品参数：`,p.specs||'—');const text=lines.join('\\n');const imgs=media(p,'image').filter(m=>m.public_url);try{if(!navigator.clipboard?.write||typeof ClipboardItem==='undefined')throw new Error('unsupported');const html=`<div>${lines.map(v=>esc(v)).join('<br>')}${imgs.map(m=>`<p><img src=\"${esc(m.public_url)}\" alt=\"${esc(p.name)}\" style=\"max-width:900px;height:auto\"></p>`).join('')}</div>`;const item={'text/plain':new Blob([text],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})};if(imgs.length){try{const r=await fetch(imgs[0].public_url);if(r.ok){const b=await r.blob();if(b.type.startsWith('image/'))item[b.type]=b}}catch(_){}}await navigator.clipboard.write([new ClipboardItem(item)]);toast(imgs.length?`资料和${imgs.length}张图片已复制`:'产品资料已复制')}catch(_){try{await navigator.clipboard.writeText(text);toast(imgs.length?'文字资料已复制；浏览器不支持同时复制图片':'产品资料已复制')}catch(e){toast('复制失败，请手动复制',true)}}};"""
          p.write_text(s[:start]+fn+s[end:],encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/page.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: copy product text and image'
          git push origin main
      - name: Cleanup workflow
        if: always()
        run: |
          git rm .github/workflows/repair-copy-handler.yml || true
          git commit -m 'chore: remove repair copy workflow' || true
          git push origin main || true
