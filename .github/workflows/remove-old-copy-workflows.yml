name: Cleanup temporary copy workflows
on:
  push:
    paths:
      - '.github/workflows/remove-old-copy-workflows.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old temporary workflows
        run: |
          rm -f .github/workflows/fix-copy-all.yml .github/workflows/finalize-copy-fix.yml .github/workflows/remove-old-copy-workflows.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'chore: cleanup temporary workflows' || exit 0
          git push origin main
