name: Fix admin nickname save
on:
  push:
    branches: [main]
    paths:
      - "fix-admin-nickname-save.trigger"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let state={user:null,profile:null,products:[],q:'',cat:'all',editingId:null,commentProduct:null,pendingImages:[],pendingVideo:null};","let state={user:null,profile:null,products:[],q:'',cat:'all',editingId:null,commentProduct:null,pendingImages:[],pendingVideo:null,adminNicknames:{}};",1)
          helper="""\nfunction profileNickname(u){try{if(u?.role==='admin'){let n=JSON.parse(u.note||'{}');return n.__admin_nickname||''}}catch{}return ''}\n"""
          marker="/* PI_ADMIN_NICKNAME_HELPER_V1 */"
          if 'function profileNickname(u)' not in s:
              if marker in s:s=s.replace(marker,marker+helper,1)
              else:s=s.replace("function esc(s){",helper+"function esc(s){",1)
          s=s.replace("async function loadProfile(u){if(!u){state.profile=null;return}let{data,error}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(error)throw error;state.profile=data||null}","async function loadProfile(u){if(!u){state.profile=null;state.adminNicknames={};return}let{data,error}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(error)throw error;state.profile=data||null;state.adminNicknames={};try{let{data:all}=await sb.from('profiles').select('*').eq('role','admin');(all||[]).forEach(x=>state.adminNicknames[x.id]=profileNickname(x))}catch(e){console.warn('load admin nicknames failed',e)}}",1)
          start="$('#userManageBtn').onclick=async()=>{"
          a=s.find(start)
          if a<0: raise SystemExit('user manage block not found')
          b=s.find("$('#messageManageBtn').onclick=",a)
          if b<0: raise SystemExit('message manager anchor not found')
          newblock="""$('#userManageBtn').onclick=async()=>{if(!isSuper())return toast('只有超级管理员可以管理用户',true);try{let{data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false});if(error)throw error;state.adminNicknames={};(data||[]).forEach(u=>{if(u.role===ROLE.ADMIN)state.adminNicknames[u.id]=profileNickname(u)});$('#usersList').innerHTML=data?.length?data.map(u=>{let rc=u.role===ROLE.SUPER?'role-super':u.role===ROLE.ADMIN?'role-admin':'';let nick=profileNickname(u);return `<div class=\"userrow\"><div><b>${esc(u.username)}</b><span class=\"badge ${rc}\">${roleText(u.role)}</span></div><div>${u.role===ROLE.ADMIN?`<input id=\"nick-${u.id}\" value=\"${esc(nick)}\" placeholder=\"管理员昵称\">`:'—'}</div><div>${u.muted?'禁言':'正常'}</div><div>${u.role===ROLE.ADMIN?`<button class=\"mini\" data-nick=\"${u.id}\">保存昵称</button>`:''}${u.role===ROLE.USER?`<button class=\"mini\" data-mute=\"${u.id}\" data-muted=\"${u.muted?'1':'0'}\">${u.muted?'解除禁言':'禁言'}</button>`:''}</div></div>`}).join(''):'<div class=\"empty\">暂无用户</div>';openModal('usersModal');$$('[data-nick]').forEach(b=>b.onclick=async()=>{const id=b.dataset.nick,nick=$('#nick-'+id).value.trim();b.disabled=true;try{const{data:cur,error:re}=await sb.from('profiles').select('note').eq('id',id).maybeSingle();if(re)throw re;let note={};try{note=JSON.parse(cur?.note||'{}')}catch{}note.__admin_nickname=nick;const{data,error}=await sb.from('profiles').update({note:JSON.stringify(note)}).eq('id',id).select('*').maybeSingle();if(error)throw error;state.adminNicknames[id]=nick;if(state.profile?.id===id)state.profile=data||{...state.profile,note:JSON.stringify(note)};const{error:pe}=await sb.from('products').update({uploader_nickname:nick||null}).eq('created_by',id);if(pe)console.warn('同步产品昵称失败',pe);toast('昵称已保存并同步');await refreshUserManagement()}catch(e){console.error(e);toast(e.message||'昵称保存失败',true)}finally{b.disabled=false}});$$('[data-mute]').forEach(b=>b.onclick=async()=>{let muted=b.dataset.muted==='1',id=b.dataset.mute;const{error}=await sb.from('profiles').update({muted:!muted}).eq('id',id);if(error)toast(error.message,true);else{toast(muted?'已解除禁言':'已禁言');await refreshUserManagement()}})};\nasync function refreshUserManagement(){if(!isSuper())return;$('#userManageBtn').click()}\n"""
          s=s[:a]+newblock+s[b:]
          s=s.replace("function getAdminNickname(id){try{if(!id)return '';return state.adminNicknames?.[id]||''}catch{return ''}}","function getAdminNickname(id){try{if(!id)return '';return state.adminNicknames?.[id]||''}catch{return ''}}",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          Path('/tmp/pi.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/pi.js
      - name: Commit fix and remove temporary files
        run: |
          rm -f fix-admin-nickname-save.trigger .github/workflows/fix-admin-nickname-save.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fix-admin-nickname-save.trigger .github/workflows/fix-admin-nickname-save.yml
          git commit -m "fix: store admin nickname in existing profile note field" || exit 0
          git push
