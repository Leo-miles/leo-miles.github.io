name: Apple Style Homepage v2
on:
  push:
    paths:
      - 'apple-home.trigger'
      - '.github/workflows/apple-home-v2.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Apple-style homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css="""\n<!-- PI_APPLE_HOME_V2 -->\n<style id="pi-apple-home-v2">\n:root{--apple-bg:#f5f5f7;--apple-text:#1d1d1f;--apple-muted:#6e6e73;--apple-blue:#0071e3;--apple-line:#d2d2d7}\nbody{background:var(--apple-bg);color:var(--apple-text)}\n.pi-v2{position:relative;overflow:hidden;border-radius:36px;margin:0 0 24px;min-height:680px;background:#050505;color:#fff;box-shadow:0 30px 90px rgba(0,0,0,.18);isolation:isolate}\n.pi-v2:before{content:\"\";position:absolute;inset:0;background:radial-gradient(circle at 72% 28%,rgba(0,113,227,.34),transparent 25%),radial-gradient(circle at 27% 80%,rgba(112,76,255,.2),transparent 27%),linear-gradient(135deg,#030303,#131418 58%,#050505);z-index:-3}\n.pi-v2-grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px;transform:perspective(950px) rotateX(62deg) translateY(26%);mask-image:radial-gradient(circle at center,#000 24%,transparent 74%);opacity:.45;z-index:-2}\n.pi-v2-orb{position:absolute;width:510px;height:510px;right:-120px;top:50%;transform:translateY(-50%);border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 100px rgba(0,113,227,.16),inset 0 0 110px rgba(80,140,255,.09);transition:transform .15s ease-out}\n.pi-v2-orb:before,.pi-v2-orb:after{content:\"\";position:absolute;border-radius:50%;inset:9%;border:1px solid rgba(255,255,255,.08)}\n.pi-v2-orb:after{inset:23%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.11),transparent 48%),rgba(0,113,227,.08);box-shadow:0 0 90px rgba(0,113,227,.22)}\n.pi-v2-ring{position:absolute;inset:17%;border-radius:50%;border:1px solid rgba(255,255,255,.09);animation:piV2Spin 19s linear infinite}\n.pi-v2-ring:after{content:\"\";position:absolute;width:7px;height:7px;border-radius:50%;right:8%;top:18%;background:#fff;box-shadow:0 0 18px #fff}\n@keyframes piV2Spin{to{transform:rotate(360deg)}}\n.pi-v2-copy{position:relative;z-index:3;padding:92px 8% 86px;max-width:900px;transition:transform .15s ease-out}\n.pi-v2-kicker{font-size:12px;letter-spacing:.18em;color:#a1a1a6;text-transform:uppercase;margin-bottom:20px}\n.pi-v2-title{font-size:clamp(48px,7vw,94px);line-height:.98;letter-spacing:-.06em;margin:0;background:linear-gradient(#fff,#b9bbc0);-webkit-background-clip:text;background-clip:text;color:transparent}\n.pi-v2-sub{max-width:650px;color:#a7a9ae;font-size:18px;line-height:1.55;margin:24px 0 0}\n.pi-v2-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}\n.pi-v2-btn{border:0;border-radius:999px;padding:13px 21px;font-weight:700;font-size:14px;transition:.22s}.pi-v2-btn:hover{transform:translateY(-2px)}.pi-v2-main{background:#fff;color:#111}.pi-v2-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.13)}\n.pi-v2-note{margin-top:28px;display:flex;gap:18px;flex-wrap:wrap;color:#888b91;font-size:11px}.pi-v2-note span{display:inline-flex;align-items:center;gap:7px}.pi-v2-dot{width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 14px rgba(48,209,88,.65)}\n.pi-v2-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 34px}.pi-v2-metric{background:#fff;border:1px solid var(--apple-line);border-radius:26px;padding:27px;min-height:165px;transition:.28s}.pi-v2-metric:hover{transform:translateY(-5px);box-shadow:0 20px 48px rgba(0,0,0,.08)}.pi-v2-metric small{font-size:11px;color:var(--apple-muted)}.pi-v2-metric strong{display:block;font-size:38px;letter-spacing:-.04em;margin-top:26px}.pi-v2-metric span{display:block;color:var(--apple-muted);font-size:12px;margin-top:4px}\n.pi-v2-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:12px 0 14px}.pi-v2-head h2{font-size:32px;letter-spacing:-.04em;margin:0}.pi-v2-head p{margin:0;color:var(--apple-muted);font-size:12px}\n.catalog .card{border-radius:24px;overflow:hidden;transition:transform .35s,box-shadow .35s}.catalog .card:hover{transform:translateY(-7px);box-shadow:0 28px 58px rgba(0,0,0,.12)}.catalog .cover{height:285px;overflow:hidden;background:#ededf0}.catalog .cover img{transition:transform .55s cubic-bezier(.2,.65,.2,1)}.catalog .card:hover .cover img{transform:scale(1.045)}.catalog .body{padding:18px}.catalog .body h3{font-size:21px;letter-spacing:-.02em}.catalog .pc-actions .mini{border-radius:999px}\n@media(max-width:900px){.pi-v2{min-height:600px}.pi-v2-copy{padding:65px 26px}.pi-v2-orb{right:-270px;opacity:.6}.pi-v2-metrics{grid-template-columns:1fr}.pi-v2-title{font-size:55px}.pi-v2-sub{font-size:16px}}\n@media(prefers-reduced-motion:reduce){.pi-v2-ring{animation:none}.pi-v2,.pi-v2-orb,.pi-v2-copy,.pi-v2-btn,.pi-v2-metric,.catalog .card,.catalog .cover img{transition:none}}\n</style>\n"""
          if '<!-- PI_APPLE_HOME_V2 -->' not in s:
              s=s.replace('</head>',css+'</head>',1)
          a=s.find('<section class="hero">')
          if a<0: raise SystemExit('hero start not found')
          b=s.find('</section>',a)
          if b<0: raise SystemExit('hero end not found')
          b+=len('</section>')
          home="""<section class="pi-v2" id="piV2Home"><div class="pi-v2-grid"></div><div class="pi-v2-orb"><div class="pi-v2-ring"></div></div><div class="pi-v2-copy"><div class="pi-v2-kicker">PRODUCT INTELLIGENCE HUB · ONLINE</div><h1 class="pi-v2-title">新品资料，<br>一眼找到。</h1><p class="pi-v2-sub">产品、参数、图片、视频与卖点，集中在一个更清晰、更快速的产品工作空间。浏览产品资料无需登录。</p><div class="pi-v2-actions"><button class="pi-v2-btn pi-v2-main" id="piV2Explore">进入产品智库　↗</button><button class="pi-v2-btn pi-v2-ghost" id="piV2Latest">探索新品</button></div><div class="pi-v2-note"><span><i class="pi-v2-dot"></i>DATA LINK ONLINE</span><span>访客模式 · 可直接浏览</span></div></div></section><div class="pi-v2-metrics"><div class="pi-v2-metric"><small>PRODUCTS</small><strong id="piV2Products">—</strong><span>产品资料</span></div><div class="pi-v2-metric"><small>CATEGORIES</small><strong id="piV2Categories">—</strong><span>产品分类</span></div><div class="pi-v2-metric"><small>ACCESS</small><strong>OPEN</strong><span>无需登录即可浏览</span></div></div><div class="pi-v2-head"><div><h2>探索产品</h2><p>像使用 Apple 产品一样，快速找到需要的资料。</p></div></div>"""
          s=s[:a]+home+s[b:]
          script="""<script id="pi-apple-home-v2-js">(()=>{const q=(s)=>document.querySelector(s);const home=q('#piV2Home');const orb=home?.querySelector('.pi-v2-orb');const copy=home?.querySelector('.pi-v2-copy');const cp=q('#piV2Products');const cc=q('#piV2Categories');function update(){try{const ps=Array.isArray(window.state?.products)?window.state.products:[];cp&&(cp.textContent=ps.length);cc&&(cc.textContent=new Set(ps.map(p=>p.category).filter(Boolean)).size)}catch(e){}}home?.addEventListener('mousemove',(e)=>{const r=home.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;if(orb)orb.style.transform=`translateY(-50%) translate(${x*18}px,${y*12}px)`;if(copy)copy.style.transform=`translate(${x*-4}px,${y*-3}px)`});home?.addEventListener('mouseleave',()=>{if(orb)orb.style.transform='translateY(-50%)';if(copy)copy.style.transform='none'});q('#piV2Explore')?.addEventListener('click',()=>document.querySelector('.layout')?.scrollIntoView({behavior:'smooth'}));q('#piV2Latest')?.addEventListener('click',()=>document.querySelector('.catalog')?.scrollIntoView({behavior:'smooth'}));document.addEventListener('keydown',(e)=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();q('.search input')?.focus()}});setTimeout(update,900);setInterval(update,3000)})();</script>"""
          if 'id="pi-apple-home-v2-js"' not in s:
              s=s.replace('</body>',script+'\n</body>',1)
          s=s.replace('state.profile.nickname || state.profile.username','(getAdminNickname(state.profile.id)||state.profile.username)',1)
          s=s.replace('u.nickname||u.username','(getAdminNickname(u.id)||u.username)')
          p.write_text(s,encoding='utf-8')
          s2=p.read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s2,re.S|re.I))
          Path('/tmp/pi.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/pi.js
      - name: Commit validated homepage
        run: |
          rm -f apple-home.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Redesign product intelligence homepage in Apple style'
          git push
