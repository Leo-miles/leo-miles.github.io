name: Update registration rules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update auth UI and validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_sub = '<div class="sub">本地演示账号仅保存在你的浏览器中。</div>'
          new_sub = '<div class="sub">账号即用户名。密码必须包含大写字母、小写字母、数字和特殊符号，且至少 8 位。</div>'
          if old_sub in s:
              s = s.replace(old_sub, new_sub, 1)

          old_input = '<div class="field"><label>密码</label><input id="regPwd" type="password"></div>'
          new_input = '<div class="field"><label>密码</label><input id="regPwd" type="password" minlength="8" autocomplete="new-password"></div>'
          if old_input in s:
              s = s.replace(old_input, new_input, 1)

          old_code = "let db=load();let state={user:null,board:null,q:'',sort:'latest',visible:8,commentPost:null};"
          new_code = "let db=load();const DEFAULT_USER={name:'Leo',hash:'3f0b159058e53d8a88b58edc206f502d83e1c844dda13d3e99973d555a10982c'};const existingLeo=db.users.find(u=>u.name==='Leo');if(existingLeo){existingLeo.hash=DEFAULT_USER.hash}else{db.users.unshift(DEFAULT_USER);save()}let state={user:null,board:null,q:'',sort:'latest',visible:8,commentPost:null};"
          if old_code in s:
              s = s.replace(old_code, new_code, 1)

          old_reg = "$('#regSubmit').onclick=async()=>{const n=$('#regName').value.trim(),p=$('#regPwd').value,p2=$('#regPwd2').value;if(n.length<2||n.length>16)return toast('用户名需要 2-16 个字符',true);if(p.length<6)return toast('密码至少 6 位',true);if(p!==p2)return toast('两次密码不一致',true);if(db.users.some(x=>x.name===n))return toast('用户名已存在',true);db.users.push({name:n,hash:await hash(p)});save();state.user={name:n};close();render();toast('注册成功')};"
          new_reg = "$('#regSubmit').onclick=async()=>{const n=$('#regName').value.trim(),p=$('#regPwd').value,p2=$('#regPwd2').value;if(n.length<2||n.length>16)return toast('用户名需要 2-16 个字符',true);if(!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(p))return toast('密码需至少 8 位，并包含大写字母、小写字母、数字和特殊符号',true);if(p!==p2)return toast('两次密码不一致',true);if(db.users.some(x=>x.name===n))return toast('用户名已存在',true);db.users.push({name:n,hash:await hash(p)});save();state.user={name:n};close();render();toast('注册成功，欢迎 '+n)};"
          if old_reg in s:
              s = s.replace(old_reg, new_reg, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update account and password registration rules"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/update-auth.yml
          git add .github/workflows/update-auth.yml
          git commit -m "Remove temporary auth update workflow" || true
          git push || true
