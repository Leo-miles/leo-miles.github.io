<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEOMILES · Product Hub</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111113;--muted:#73737a;--line:#e7e7eb;--accent:#111113;--blue:#147ef5;--green:#25a05a;--shadow:0 12px 40px rgba(20,20,30,.07);--radius:22px}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;background:#f7f7f8}.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;pointer-events:none}.o1{width:420px;height:420px;background:#dfeaff;top:-150px;right:-80px}.o2{width:360px;height:360px;background:#eee3ff;bottom:-150px;left:-80px}.login-card{width:min(420px,calc(100% - 32px));padding:42px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.82);backdrop-filter:blur(25px);border-radius:30px;box-shadow:0 25px 80px rgba(0,0,0,.09);position:relative;z-index:1}.brand{text-align:center;margin-bottom:32px}.logo{width:48px;height:48px;border-radius:15px;background:#111;color:white;display:grid;place-items:center;margin:0 auto 16px;font-weight:800;letter-spacing:-2px}.brand h1{font-size:23px;margin:0}.brand p{color:var(--muted);margin:8px 0 0;font-size:13px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fafafc;border-radius:12px;padding:13px 14px;outline:none;transition:.2s}.field input:focus,.field textarea:focus,.field select:focus{border-color:#aaa;box-shadow:0 0 0 4px rgba(0,0,0,.04)}.primary{border:0;background:#111;color:#fff;border-radius:12px;padding:13px 18px;font-weight:650;width:100%;transition:.2s}.primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.15)}.login-links{display:flex;justify-content:center;gap:12px;color:var(--muted);font-size:12px;margin-top:18px}.shell{display:flex;min-height:100vh}.sidebar{width:238px;background:rgba(255,255,255,.82);border-right:1px solid var(--line);padding:24px 16px;position:fixed;inset:0 auto 0 0}.side-brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px;font-weight:800}.side-logo{width:34px;height:34px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;font-size:12px}.nav-title{font-size:11px;color:#aaa;padding:12px 12px 8px}.nav button{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:10px;color:#626268;font-size:14px;margin:2px 0}.nav button.active,.nav button:hover{background:#f0f0f2;color:#111;font-weight:600}.side-bottom{position:absolute;bottom:22px;left:16px;right:16px;border-top:1px solid var(--line);padding-top:16px}.main{margin-left:238px;width:calc(100% - 238px)}.topbar{height:72px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{font-size:14px;color:var(--muted)}.user{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:12px}.page{padding:34px;max-width:1440px;margin:auto}.page-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:26px}.page-head h2{font-size:32px;letter-spacing:-1px;margin:0}.page-head p{margin:8px 0 0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:11px;font-weight:600}.btn.dark{background:#111;color:#fff;border-color:#111}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:22px}.search{flex:1;max-width:460px}.search input{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:0;background:#fff;color:#777;padding:9px 13px;border-radius:20px;font-size:12px}.chip.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.25s;box-shadow:0 5px 20px rgba(0,0,0,.025)}.product:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.pimg{height:235px;background:linear-gradient(135deg,#f0f1f3,#fafafa);display:grid;place-items:center;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:cover;transition:.35s}.product:hover .pimg img{transform:scale(1.035)}.mock-product{font-size:54px;font-weight:800;letter-spacing:-5px;color:#aaa}.pbody{padding:18px}.status{font-size:11px;color:var(--green);background:#edf9f1;border-radius:20px;padding:5px 8px;display:inline-block}.pbody h3{font-size:18px;margin:12px 0 5px}.pbody p{color:var(--muted);font-size:12px;margin:0 0 15px}.prow{display:flex;justify-content:space-between;align-items:center}.price{font-weight:750}.more{border:0;background:transparent;font-weight:650;font-size:12px}.detail{display:grid;grid-template-columns:1.15fr .85fr;gap:34px}.hero-img{height:540px;border-radius:26px;background:linear-gradient(135deg,#eceef1,#fff);display:grid;place-items:center;overflow:hidden}.hero-img img{width:100%;height:100%;object-fit:cover}.detail h1{font-size:42px;letter-spacing:-1.5px;margin:10px 0}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}.lead{font-size:17px;line-height:1.7;color:#555}.sell-list{padding:0;margin:25px 0;list-style:none}.sell-list li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:26px}.info-grid div{background:#fff;padding:15px}.info-grid small{display:block;color:#999;font-size:11px;margin-bottom:5px}.info-grid b{font-size:14px}.upload{max-width:920px}.upload-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:18px}.upload-card h3{margin:0 0 18px;font-size:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.drop{border:1.5px dashed #ccc;border-radius:18px;padding:35px;text-align:center;background:#fafafa}.drop strong{display:block;font-size:28px;margin-bottom:8px}.drop span{font-size:12px;color:#999}.preview-row{display:flex;gap:10px;margin-top:12px}.thumb{width:90px;height:75px;border-radius:10px;background:#eee;display:grid;place-items:center;color:#999;font-size:11px}.upload-actions{display:flex;justify-content:flex-end;gap:10px}.sales-hero{background:#111;color:#fff;border-radius:28px;padding:38px 42px;margin-bottom:28px;position:relative;overflow:hidden}.sales-hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#34343a;right:-100px;top:-160px;filter:blur(5px)}.sales-hero h2{font-size:34px;margin:0 0 8px;letter-spacing:-1px}.sales-hero p{margin:0;color:#aaa}.sales-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:25px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat small{color:#999}.stat b{display:block;font-size:28px;margin-top:6px}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:13px 17px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:20}.mobile-menu{display:none}@media(max-width:900px){.sidebar{width:78px}.side-brand span,.nav-title,.nav button span,.side-bottom{display:none}.main{margin-left:78px;width:calc(100% - 78px)}.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.hero-img{height:400px}}@media(max-width:620px){.sidebar{display:none}.main{margin:0;width:100%}.topbar{padding:0 18px}.mobile-menu{display:block}.page{padding:20px}.grid{grid-template-columns:1fr}.two,.sales-stats{grid-template-columns:1fr}.page-head{align-items:start;gap:14px}.page-head h2{font-size:26px}.detail h1{font-size:34px}.toolbar{flex-direction:column;align-items:stretch}.search{max-width:none}.login-card{padding:30px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const products=[
 {id:'L291',name:'L291 筋膜枪',cat:'美容健康',price:'¥29',sell:'¥59',desc:'深层放松 · 静音便携 · 多档调节',status:'已发布',mark:'L291'},
 {id:'F120',name:'智能封口机',cat:'小家电',price:'¥12',sell:'¥29',desc:'快速封口 · 小巧便携 · 一键操作',status:'已发布',mark:'F120'},
 {id:'P520',name:'便携充电宝 Pro',cat:'3C数码',price:'¥39',sell:'¥79',desc:'大容量 · 快充 · 轻薄设计',status:'待审核',mark:'P520'}
];
let view='products';let role='picker';let selected=products[0];
function logo(){return '<div class="logo">LM</div>'}
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="orb o1"></div><div class="orb o2"></div><div class="login-card"> <div class="brand">${logo()}<h1>LEOMILES</h1><p>Product Selection & Sales Hub</p></div><div class="field"><label>账号</label><input id="loginUser" placeholder="邮箱 / 手机号"></div><div class="field"><label>密码</label><input type="password" placeholder="请输入密码"></div><button class="primary" onclick="enter()">登录</button><div class="login-links"><span>忘记密码</span><span>·</span><span>注册账号</span></div></div></div>`}
function enter(){render();toast('欢迎进入 LEOMILES 产品中心')}
function nav(){return `<aside class="sidebar"><div class="side-brand"><div class="side-logo">LM</div><span>LEOMILES</span></div><div class="nav-title">工作区</div><div class="nav"><button class="${view==='products'?'active':''}" onclick="go('products')">▦ <span>产品库</span></button><button class="${view==='upload'?'active':''}" onclick="go('upload')">＋ <span>上传产品</span></button><button class="${view==='sales'?'active':''}" onclick="go('sales')">◈ <span>销售端</span></button></div><div class="nav-title">账户</div><div class="nav"><button onclick="toast('设置将在后续版本开放')">⚙ <span>设置</span></button></div><div class="side-bottom"><button class="nav button" onclick="login()">退出登录</button></div></aside>`}
function top(){return `<header class="topbar"><div class="crumb">LEOMILES / ${view==='products'?'产品库':view==='upload'?'上传产品':view==='detail'?'产品详情':'销售端'}</div><div class="user"><span>${role==='sales'?'销售人员':'选品人员'}</span><div class="avatar">LM</div></div></header>`}
function productCard(p){return `<article class="product"><div class="pimg"><div class="mock-product">${p.mark}</div></div><div class="pbody"><span class="status">● ${p.status}</span><h3>${p.name}</h3><p>${p.desc}</p><div class="prow"><span class="price">${p.price}</span><button class="more" onclick='openDetail(${JSON.stringify(p)})'>查看详情 →</button></div></div></article>`}
function productsPage(){return `<div class="page"><div class="page-head"><div><h2>产品库</h2><p>集中管理产品资料，并同步给销售端。</p></div><button class="btn dark" onclick="go('upload')">＋ 上传产品</button></div><div class="toolbar"><div class="search"><input placeholder="搜索产品名称、编号、关键词……" oninput="filterProducts(this.value)"></div><div class="chips"><button class="chip active">全部</button><button class="chip">3C数码</button><button class="chip">小家电</button><button class="chip">美容健康</button></div></div><div id="productGrid" class="grid">${products.map(productCard).join('')}</div></div>`}
function filterProducts(q){const list=products.filter(p=>(p.name+p.id+p.desc).toLowerCase().includes(q.toLowerCase()));document.getElementById('productGrid').innerHTML=list.map(productCard).join('')||'<p style="color:#888">没有找到匹配产品</p>'}
function uploadPage(){return `<div class="page upload"><div class="page-head"><div><h2>上传产品</h2><p>建立一次产品档案，销售端即可同步使用。</p></div></div><div class="upload-card"><h3>基本信息</h3><div class="two"><div class="field"><label>产品名称</label><input placeholder="例如：L291 筋膜枪"></div><div class="field"><label>产品编号</label><input placeholder="例如：L291"></div></div><div class="field"><label>产品分类</label><select><option>美容健康</option><option>3C数码</option><option>小家电</option><option>户外</option></select></div></div><div class="upload-card"><h3>产品图片</h3><div class="drop" onclick="toast('图片上传功能将在接入 Supabase Storage 后启用')"><strong>＋</strong><span>点击上传图片 · 支持 JPG / PNG / WEBP</span></div><div class="preview-row"><div class="thumb">预览 01</div><div class="thumb">预览 02</div><div class="thumb">预览 03</div></div></div><div class="upload-card"><h3>产品卖点与资料</h3><div class="field"><label>一句话卖点</label><input placeholder="用一句话说明产品最大的价值"></div><div class="two"><div class="field"><label>卖点 1</label><input placeholder="例如：多档力度调节"></div><div class="field"><label>卖点 2</label><input placeholder="例如：Type-C 快充"></div></div><div class="field"><label>详细资料</label><textarea rows="5" placeholder="产品描述、使用场景、注意事项等"></textarea></div></div><div class="upload-card"><h3>价格与销售资料</h3><div class="two"><div class="field"><label>采购价</label><input placeholder="¥ 0.00"></div><div class="field"><label>MOQ</label><input placeholder="例如：100"></div><div class="field"><label>建议销售价</label><input placeholder="¥ 0.00"></div><div class="field"><label>内部备注</label><input placeholder="仅内部人员可见"></div></div></div><div class="upload-actions"><button class="btn" onclick="toast('已保存为草稿')">保存草稿</button><button class="btn dark" onclick="toast('产品已发布，销售端可同步查看')">发布产品</button></div></div>`}
function detailPage(p=selected){return `<div class="page"><button class="btn" onclick="go('products')">← 返回产品库</button><div style="height:22px"></div><div class="detail"><div><div class="hero-img"><div class="mock-product" style="font-size:90px">${p.mark}</div></div></div><div><span class="eyebrow">${p.id} / ${p.cat}</span><h1>${p.name}</h1><p class="lead">${p.desc}</p><span class="status">● ${p.status}</span><ul class="sell-list"><li>01　核心卖点：产品资料清晰，销售可直接使用</li><li>02　核心卖点：图片与素材集中管理</li><li>03　核心卖点：资料修改后自动同步销售端</li></ul><div class="info-grid"><div><small>采购价</small><b>${p.price}</b></div><div><small>建议售价</small><b>${p.sell}</b></div><div><small>产品编号</small><b>${p.id}</b></div><div><small>状态</small><b>${p.status}</b></div></div><div style="display:flex;gap:10px;margin-top:24px"><button class="btn dark" onclick="go('upload')">编辑资料</button><button class="btn" onclick="toast('销售端已同步最新资料')">同步销售端</button></div></div></div></div>`}
function salesPage(){const published=products.filter(p=>p.status==='已发布');return `<div class="page"><div class="sales-hero"><h2>销售产品中心</h2><p>已发布产品会自动同步到这里，销售无需重复整理资料。</p><div class="sales-stats"><div class="stat"><small>可销售产品</small><b>${published.length}</b></div><div class="stat"><small>新品</small><b>2</b></div><div class="stat"><small>资料完整率</small><b>96%</b></div></div></div><div class="page-head"><div><h2 style="font-size:24px">可销售产品</h2><p>只展示已经发布的产品。</p></div></div><div class="grid">${published.map(productCard).join('')}</div></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="shell">${nav()}<main class="main">${top()}<div id="content">${view==='products'?productsPage():view==='upload'?uploadPage():view==='detail'?detailPage():salesPage()}</div></main></div>`}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function openDetail(p){selected=p;go('detail')}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
login();
</script>
</body>
</html>
