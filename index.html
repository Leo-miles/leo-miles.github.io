<html lang="zh-CN">
<head>

<title>产品智库 · LeoMiles</title>

<style>
:root{--bg:#07101c;--panel:#0d1827;--panel2:#111f31;--line:#24344a;--text:#f6f8fb;--muted:#91a0b5;--gold:#d7b56d;--ok:#58d68d;--danger:#ff6b6b;--radius:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#1b2e48 0,#07101c 42%);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1360px;margin:auto;padding:0 22px}.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);background:#07101cdd;border-bottom:1px solid #152336}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:.4px;font-size:18px}.brand span{color:var(--gold)}.nav-actions{display:flex;align-items:center;gap:10px}.btn{border:1px solid var(--line);background:#111d2d;color:var(--text);padding:10px 14px;border-radius:12px}.btn:hover{border-color:#49627f}.btn.primary{background:#f2e7cb;color:#18202a;border-color:#f2e7cb;font-weight:700}.btn.ghost{background:transparent}.hero{padding:54px 0 28px}.eyebrow{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:12px}.hero h1{font-size:clamp(34px,6vw,70px);line-height:1.02;margin:14px 0}.hero p{max-width:700px;color:var(--muted);font-size:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px}.stat,.card,.modal-card{background:linear-gradient(180deg,#0f1a2a,#0b1624);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 16px 40px #0003}.stat{padding:18px}.stat b{display:block;font-size:28px;margin-top:5px}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:18px 0 60px}.side{position:sticky;top:88px;height:max-content}.side-title{color:var(--muted);font-size:12px;margin:4px 0 10px}.cat{display:flex;justify-content:space-between;width:100%;text-align:left;padding:10px 12px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--muted)}.cat.active,.cat:hover{background:#102039;color:var(--text);border-color:#203651}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:220px;padding:12px 14px;background:#0b1624;border:1px solid var(--line);border-radius:13px;color:var(--text);outline:none}.search:focus,.field:focus,.textarea:focus{border-color:#587391}.count{color:var(--muted);padding:12px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{overflow:hidden;cursor:pointer}.thumb{aspect-ratio:1.35;background:#0b1420;display:flex;align-items:center;justify-content:center;color:#617088}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.product-body{padding:15px}.tag{display:inline-flex;font-size:11px;border:1px solid #33465e;color:#b9c7d8;border-radius:999px;padding:3px 8px;margin-bottom:8px}.product h3{margin:0 0 4px;font-size:17px}.meta{color:var(--muted);font-size:12px}.price{margin-top:11px;font-size:17px;font-weight:800}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}.modal-card{width:min(100%,920px);max-height:92vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.close{border:0;background:transparent;color:var(--muted);font-size:25px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field-wrap label{display:block;color:#c7d1df;font-size:12px;margin-bottom:6px}.field,.textarea,select{width:100%;padding:11px 12px;background:#091321;border:1px solid var(--line);border-radius:11px;color:var(--text);outline:none}.textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.section{margin-top:18px;padding-top:18px;border-top:1px solid #1a2b40}.section h4{margin:0 0 10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.media-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#091321;border:1px solid var(--line)}.media-item img,.media-item video{width:100%;height:100%;object-fit:cover}.media-remove{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:#0009;color:white}.drop{border:1px dashed #405674;padding:25px;text-align:center;border-radius:14px;color:var(--muted);margin-top:10px}.drop.drag{border-color:var(--gold);background:#1a2637}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}.sell-no{display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800}.toast{position:fixed;right:18px;bottom:18px;z-index:80;max-width:420px;padding:13px 16px;border-radius:13px;background:#102039;border:1px solid #35506d;box-shadow:0 12px 30px #0008}.toast.ok{border-color:#2a7650}.toast.err{border-color:#8b3945}.detail-media{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}.detail-main{aspect-ratio:1.3;border-radius:15px;overflow:hidden;background:#091321}.detail-main img,.detail-main video{width:100%;height:100%;object-fit:cover}.detail-side{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:330px;overflow:auto}.detail-side div{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#091321}.detail-side img,.detail-side video{width:100%;height:100%;object-fit:cover}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}.kv div{background:#0a1523;border:1px solid #1c2c41;border-radius:12px;padding:10px}.kv small{color:var(--muted);display:block}.points{padding-left:20px}.comment{border-top:1px solid #1a2b40;padding:12px 0}.comment b{font-size:12px}.comment p{margin:4px 0;color:#ced6e1}.adminbar{margin-bottom:14px;padding:14px;border:1px solid #2e4058;border-radius:15px;background:#0b1828;display:flex;justify-content:space-between;gap:12px;align-items:center}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #1b2a3d;padding:10px;text-align:left;vertical-align:top}.muted{color:var(--muted)}.danger{color:var(--danger)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.detail-media{grid-template-columns:1fr}.detail-side{grid-template-columns:repeat(5,1fr);max-height:none}.form-grid{grid-template-columns:1fr}.media-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.wrap{padding:0 14px}.hero{padding-top:36px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.nav{height:62px}.nav-actions .btn.ghost{display:none}.media-grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="top"><div class="wrap nav"><div class="brand">LeoMiles <span>· Product Intelligence</span></div><div class="nav-actions"><button class="btn ghost" id="loginBtn">登录</button><button class="btn primary hidden" id="adminBtn">后台</button><button class="btn ghost hidden" id="logoutBtn">退出</button></div></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">PRODUCT INTELLIGENCE HUB</div><h1>把产品资料，变成真正可用的决策资产。</h1><p>产品、成本、参数、卖点、图片与协作记录集中管理。搜索一次，直接复制到微信、钉钉、Excel、Word 或邮件。</p><div class="stats"><div class="stat"><span class="muted">产品总数</span><b id="statProducts">0</b></div><div class="stat"><span class="muted">分类</span><b id="statCats">0</b></div><div class="stat"><span class="muted">媒体素材</span><b id="statMedia">0</b></div><div class="stat"><span class="muted">当前身份</span><b id="statRole">访客</b></div></div></section>
<section class="layout"><aside class="side"><div class="side-title">产品分类</div><div id="cats"></div></aside><section><div id="adminBar" class="adminbar hidden"><div><b>内容管理</b><div class="muted">管理员可发布、编辑、上传素材与处理用户内容。</div></div><button class="btn primary" id="newProductBtn">＋ 新建产品</button></div><div class="toolbar"><input id="search" class="search" placeholder="搜索产品名、型号、供应商、参数、卖点…"><span id="count" class="count"></span></div><div id="grid" class="grid"></div></section></section>
</main>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const SUPABASE_URL='https://zzkujghfxbjafvmlkwqz.supabase.co';
const SUPABASE_KEY='sb_publishable_LYoWqn32khuKfipDWW40MQ_ggoW0FGf';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const state={user:null,profile:null,role:'user',categories:[],products:[],media:[],comments:[],q:'',cat:'all',draftMedia:[],editId:null};
const $=s=>document.querySelector(s);
function toast(msg,type='ok'){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toastRoot').appendChild(el);setTimeout(()=>el.remove(),3600)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function roleLabel(){return state.role==='superadmin'?'超级管理员':state.role==='admin'?'管理员':'普通用户'}
function isAdmin(){return ['admin','superadmin'].includes(state.role)}
function calcCost(d){return [d.cell_price*d.cell_count,d.assembly_fee,d.other_cost].filter(Number.isFinite).reduce((a,b)=>a+b,0)}
function catName(id){return state.categories.find(c=>c.id===id)?.name||'未分类'}
async function init(){
 const [{data:cat},{data:prod},{data:med}]=await Promise.all([
  sb.from('categories').select('*').order('sort_order'),
  sb.from('products').select('*').order('updated_at',{ascending:false}),
  sb.from('product_media').select('*').order('sort_order')
 ]);
 state.categories=cat||[];state.products=prod||[];state.media=med||[];render();refreshStats();
 const {data:{session}}=await sb.auth.getSession(); if(session) await hydrate(session.user);
 sb.auth.onAuthStateChange(async(e,s)=>{ if(e==='SIGNED_IN'&&s?.user) await hydrate(s.user); if(e==='SIGNED_OUT'){state.user=null;state.profile=null;state.role='user';renderHeader()} });
}
async function hydrate(user){state.user=user;const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error){toast('账号已登录，但角色资料读取失败：'+error.message,'err');state.profile=null;state.role='user'}else{state.profile=p;state.role=p?.role||'user'}renderHeader();render();refreshStats()}
function renderHeader(){const logged=!!state.user;$('#loginBtn').classList.toggle('hidden',logged);$('#logoutBtn').classList.toggle('hidden',!logged);$('#adminBtn').classList.toggle('hidden',!isAdmin());$('#adminBar').classList.toggle('hidden',!isAdmin());$('#statRole').textContent=logged?roleLabel():'访客'}
function renderCats(){const all=[{id:'all',name:'全部产品'}].concat(state.categories);$('#cats').innerHTML=all.map(c=>`<button class="cat ${state.cat===c.id?'active':''}" data-cat="${c.id}"><span>${esc(c.name)}</span><span>${c.id==='all'?state.products.length:state.products.filter(p=>p.category_id===c.id).length}</span></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render()})}
function matches(p){const hay=[p.name,p.model,p.supplier,p.description,JSON.stringify(p.parameters),JSON.stringify(p.selling_points),p.uploader_nickname].join(' ').toLowerCase();return (!state.q||hay.includes(state.q.toLowerCase()))&&(state.cat==='all'||p.category_id===state.cat)}
function cover(p){return state.media.filter(m=>m.product_id===p.id&&m.media_type==='image').sort((a,b)=>a.sort_order-b.sort_order)[0]}
function render(){renderCats();const list=state.products.filter(matches);$('#count').textContent=`${list.length} 个产品`;$('#grid').innerHTML=list.length?list.map(p=>{const m=cover(p);return `<article class="card product" data-id="${p.id}"><div class="thumb">${m?`<img src="${esc(sb.storage.from('product-media').getPublicUrl(m.storage_path).data.publicUrl)}" alt="">`:'暂无图片'}</div><div class="product-body"><span class="tag">${esc(catName(p.category_id))}</span><h3>${esc(p.name)}</h3><div class="meta">${esc(p.model||'未填写型号')} · ${esc(p.supplier||'未填写供应商')}</div><div class="price">${p.price!=null?'¥'+Number(p.price).toFixed(2):'价格待补充'}</div></div></article>`}).join(''):`<div class="empty">没有找到匹配的产品。<br><span>尝试换个关键词或切换分类。</span></div>`;document.querySelectorAll('.product').forEach(x=>x.onclick=()=>openDetail(x.dataset.id))}
function refreshStats(){ $('#statProducts').textContent=state.products.length;$('#statCats').textContent=state.categories.length;$('#statMedia').textContent=state.media.length }
$('#search').oninput=e=>{state.q=e.target.value.trim();render()};$('#loginBtn').onclick=()=>openLogin();$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();toast('已退出登录')};$('#newProductBtn').onclick=()=>openEditor();$('#adminBtn').onclick=()=>openAdmin();
function openLogin(){openModal(`<div class="modal-head"><div><h2>登录产品智库</h2><div class="muted">账号可填写 leo、user1 等现有账号，也可填写完整邮箱。</div></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid" style="margin-top:15px"><div class="field-wrap full"><label>账号</label><input id="loginAccount" class="field" autocomplete="username" placeholder="leo / user1 / 邮箱"></div><div class="field-wrap full"><label>密码</label><input id="loginPassword" class="field" type="password" autocomplete="current-password"></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn" onclick="openRegister()">注册普通账号</button><button class="btn primary" onclick="doLogin()">登录</button></div>`)}
function accountEmail(a){return a.includes('@')?a:a+'@accounts.leo-product-center.invalid'}
async function doLogin(){const a=$('#loginAccount').value.trim(),pw=$('#loginPassword').value;if(!a||!pw)return toast('请填写账号和密码','err');const {error}=await sb.auth.signInWithPassword({email:accountEmail(a),password:pw});if(error)return toast('登录失败：'+error.message,'err');closeModal();toast('登录成功')}
function openRegister(){openModal(`<div class="modal-head"><div><h2>注册普通账号</h2><div class="muted">注册后默认是普通用户，不能直接发布产品。</div></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid" style="margin-top:15px"><div class="field-wrap"><label>账号名</label><input id="regUser" class="field" placeholder="例如 leo2"></div><div class="field-wrap"><label>显示名称</label><input id="regName" class="field" placeholder="例如 Leo"></div><div class="field-wrap full"><label>邮箱（用于 Supabase 登录确认）</label><input id="regEmail" class="field" type="email" placeholder="you@example.com"></div><div class="field-wrap"><label>密码</label><input id="regPw" class="field" type="password"></div><div class="field-wrap"><label>确认密码</label><input id="regPw2" class="field" type="password"></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn" onclick="openLogin()">返回登录</button><button class="btn primary" onclick="doRegister()">创建账号</button></div>`)}
async function doRegister(){const u=$('#regUser').value.trim(),n=$('#regName').value.trim(),e=$('#regEmail').value.trim(),p=$('#regPw').value,p2=$('#regPw2').value;if(!u||!e||!p)return toast('账号名、邮箱、密码必填','err');if(p!==p2)return toast('两次密码不一致','err');const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{username:u,display_name:n||u}}});if(error)return toast('注册失败：'+error.message,'err');closeModal();toast(data.session?'注册成功，已自动登录':'注册成功，请完成邮箱确认后登录')}
function openModal(html){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card">${html}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function openDetail(id){const p=state.products.find(x=>x.id===id);if(!p)return;const ms=state.media.filter(m=>m.product_id===id).sort((a,b)=>a.sort_order-b.sort_order);const imgs=ms.filter(m=>m.media_type==='image');const first=imgs[0];const main=first?`<img src="${esc(sb.storage.from('product-media').getPublicUrl(first.storage_path).data.publicUrl)}" alt="">`:'<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#607089">暂无图片</div>';openModal(`<div class="modal-head"><div><span class="tag">${esc(catName(p.category_id))}</span><h2 style="margin:8px 0 0">${esc(p.name)}</h2><div class="muted">${esc(p.model||'')} · ${esc(p.supplier||'')}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="detail-media" style="margin-top:18px"><div class="detail-main">${main}</div><div class="detail-side">${ms.map(m=>{const u=sb.storage.from('product-media').getPublicUrl(m.storage_path).data.publicUrl;return `<div>${m.media_type==='video'?`<video src="${esc(u)}" controls></video>`:`<img src="${esc(u)}" alt="">`}</div>`}).join('')}</div></div><div class="kv"><div><small>价格</small>${p.price==null?'—':'¥'+Number(p.price).toFixed(2)}</div><div><small>MOQ</small>${p.moq??'—'}</div><div><small>交期</small>${esc(p.delivery||'—')}</div><div><small>包装/装箱</small>${esc(p.carton||'—')}</div><div><small>上传者</small>${esc(p.uploader_nickname||'—')}</div><div><small>更新时间</small>${new Date(p.updated_at).toLocaleString()}</div></div><div class="section"><h4>参数</h4><div class="muted">${Object.entries(p.parameters||{}).map(([k,v])=>`<div>${esc(k)}：${esc(v)}</div>`).join('')||'暂无'}</div></div><div class="section"><h4>卖点</h4><ol class="points">${(p.selling_points||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>暂无</li>'}</ol></div><div class="section"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" onclick="copyProduct('${p.id}')">一键复制完整产品信息</button>${isAdmin()?`<button class="btn" onclick="openEditor('${p.id}')">编辑</button><button class="btn" onclick="deleteProduct('${p.id}')">删除</button>`:''}</div></div><div class="section"><h4>评论</h4><div id="commentList">加载中…</div>${state.user?`<div style="display:flex;gap:8px;margin-top:10px"><input id="commentInput" class="field" placeholder="添加内部评论 / 备注"><button class="btn" onclick="addComment('${p.id}')">发送</button></div>`:'<div class="muted">登录后可发表评论。</div>'}</div>`);loadComments(id)}
async function loadComments(pid){const {data}=await sb.from('comments').select('id,body,created_at,author_id').eq('product_id',pid).order('created_at',{ascending:false});const el=$('#commentList');if(!el)return;el.innerHTML=(data||[]).map(c=>`<div class="comment"><b>${esc(state.profiles?.[c.author_id]||c.author_id.slice(0,8))}</b><div class="muted">${new Date(c.created_at).toLocaleString()}</div><p>${esc(c.body)}</p></div>`).join('')||'<div class="muted">暂无评论。</div>'}
async function addComment(pid){const v=$('#commentInput').value.trim();if(!v)return;const {error}=await sb.from('comments').insert({product_id:pid,author_id:state.user.id,body:v});if(error)return toast('评论失败：'+error.message,'err');$('#commentInput').value='';loadComments(pid);toast('评论已添加')}
function openEditor(id){if(!isAdmin())return toast('需要管理员权限','err');state.editId=id||null;const p=id?state.products.find(x=>x.id===id):null;const points=(p?.selling_points||['']).map(x=>`<div class="row"><span class="sell-no">•</span><input class="field sell" value="${esc(x)}"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`).join('');const params=Object.entries(p?.parameters||{}).map(([k,v])=>`<div class="row paramrow"><input class="field pk" value="${esc(k)}" placeholder="参数名"><input class="field pv" value="${esc(v)}" placeholder="参数值"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`).join('')||`<div class="row paramrow"><input class="field pk" placeholder="例如 功率"><input class="field pv" placeholder="例如 20W"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`;openModal(`<div class="modal-head"><div><h2>${p?'编辑产品':'新建产品'}</h2><div class="muted">保存成功后再上传媒体，任何失败都会直接提示。</div></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid" style="margin-top:16px"><div class="field-wrap"><label>产品名称 *</label><input id="f_name" class="field" value="${esc(p?.name)}"></div><div class="field-wrap"><label>型号</label><input id="f_model" class="field" value="${esc(p?.model)}"></div><div class="field-wrap"><label>分类 *</label><select id="f_cat">${state.categories.map(c=>`<option value="${c.id}" ${p?.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field-wrap"><label>供应商</label><input id="f_supplier" class="field" value="${esc(p?.supplier)}"></div><div class="field-wrap"><label>价格</label><input id="f_price" class="field" type="number" step="0.01" value="${p?.price??''}"></div><div class="field-wrap"><label>MOQ</label><input id="f_moq" class="field" type="number" value="${p?.moq??''}"></div><div class="field-wrap"><label>交期</label><input id="f_delivery" class="field" value="${esc(p?.delivery)}"></div><div class="field-wrap"><label>包装/装箱</label><input id="f_carton" class="field" value="${esc(p?.carton)}"></div><div class="field-wrap"><label>上传者昵称</label><input id="f_uploader" class="field" value="${esc(p?.uploader_nickname||state.profile?.display_name||state.profile?.username)}"></div><div class="field-wrap"><label>状态</label><select id="f_pub"><option value="true" ${p?.published!==false?'selected':''}>已发布</option><option value="false" ${p?.published===false?'selected':''}>草稿</option></select></div><div class="field-wrap full"><label>说明</label><textarea id="f_desc" class="textarea">${esc(p?.description)}</textarea></div></div><div class="section"><h4>自定义参数</h4><div id="params" class="rows">${params}</div><button class="btn" style="margin-top:8px" onclick="addParam()">＋ 添加参数</button></div><div class="section"><h4>卖点（1、2、3…）</h4><div id="points" class="rows">${points}</div><button class="btn" style="margin-top:8px" onclick="addPoint()">＋ 添加卖点</button></div><div class="section"><h4>充电宝成本（选择“充电宝”时填写）</h4><div class="form-grid"><div class="field-wrap"><label>电芯型号</label><input id="f_cell_model" class="field" value="${esc(p?.cell_model)}"></div><div class="field-wrap"><label>电芯数量</label><input id="f_cell_count" class="field" type="number" value="${p?.cell_count??''}"></div><div class="field-wrap"><label>实际容量 mAh</label><input id="f_capacity" class="field" type="number" value="${p?.actual_cell_capacity??''}"></div><div class="field-wrap"><label>单颗电芯价格</label><input id="f_cell_price" class="field" type="number" step="0.01" value="${p?.cell_price??''}"></div><div class="field-wrap"><label>组装费</label><input id="f_assembly" class="field" type="number" step="0.01" value="${p?.assembly_fee??''}"></div><div class="field-wrap"><label>其他成本</label><input id="f_other" class="field" type="number" step="0.01" value="${p?.other_cost??''}"></div><div class="field-wrap"><label>套装价</label><input id="f_kit" class="field" type="number" step="0.01" value="${p?.kit_price??''}"></div><div class="field-wrap"><label>总成本（自动）</label><input id="f_total" class="field" readonly value="${p?.total_cost??''}"></div></div></div><div class="section"><h4>图片 / 视频</h4><div id="mediaPreview" class="media-grid">${state.editId?state.media.filter(m=>m.product_id===state.editId).sort((a,b)=>a.sort_order-b.sort_order).map(m=>mediaPreview(m)).join(''):''}</div><div id="drop" class="drop">拖拽图片/视频到这里，或点击选择文件；也支持 Ctrl+V 粘贴图片<input id="mediaInput" type="file" accept="image/*,video/*" multiple hidden></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveProduct()">保存产品</button></div>`);bindEditorMedia();calcEditorTotal()}
function mediaPreview(m,pending=false){const u=pending?m.preview:sb.storage.from('product-media').getPublicUrl(m.storage_path).data.publicUrl;return `<div class="media-item" data-pending="${pending?'1':'0'}" data-id="${pending?m.id:m.id}">${m.media_type==='video'?`<video src="${esc(u)}"></video>`:`<img src="${esc(u)}">`}<button class="media-remove" onclick="removeEditorMedia('${m.id}',${pending})">×</button></div>`}
function bindEditorMedia(){const drop=$('#drop'),input=$('#mediaInput');drop.onclick=e=>{if(e.target!==input)input.click()};input.onchange=()=>handleFiles(input.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');handleFiles(e.dataTransfer.files)};window.onpaste=e=>{if(!$('#mediaInput'))return;const fs=[...e.clipboardData.files].filter(f=>f.type.startsWith('image/'));handleFiles(fs)};['cell_price','cell_count','assembly','other'].forEach(id=>$('#f_'+id)?.addEventListener('input',calcEditorTotal))}
function handleFiles(files){[...files].forEach(file=>{if(!/^(image|video)\//.test(file.type))return;const obj={id:crypto.randomUUID(),file,preview:URL.createObjectURL(file),media_type:file.type.startsWith('video/')?'video':'image'};state.draftMedia.push(obj);$('#mediaPreview').insertAdjacentHTML('beforeend',mediaPreview(obj,true))})}
function removeEditorMedia(id,pending){if(pending)state.draftMedia=state.draftMedia.filter(x=>x.id!==id);document.querySelector(`.media-item[data-id="${id}"]`)?.remove()}
function addPoint(){const d=document.createElement('div');d.className='row';d.innerHTML='<span class="sell-no">•</span><input class="field sell"><button class="btn" onclick="this.parentElement.remove()">×</button>';$('#points').appendChild(d)}
function addParam(){const d=document.createElement('div');d.className='row paramrow';d.innerHTML='<input class="field pk" placeholder="参数名"><input class="field pv" placeholder="参数值"><button class="btn" onclick="this.parentElement.remove()">×</button>';$('#params').appendChild(d)}
function calcEditorTotal(){const price=Number($('#f_cell_price')?.value),count=Number($('#f_cell_count')?.value),a=Number($('#f_assembly')?.value),o=Number($('#f_other')?.value);if($('#f_total'))$('#f_total').value=Number.isFinite(price*count+a+o)?(price*count+a+o).toFixed(2):''}
function formData(){const params={};document.querySelectorAll('#params .paramrow').forEach(r=>{const k=r.querySelector('.pk').value.trim(),v=r.querySelector('.pv').value.trim();if(k)params[k]=v});const selling=[...document.querySelectorAll('#points .sell')].map(x=>x.value.trim()).filter(Boolean);const cellPrice=Number($('#f_cell_price').value),cellCount=Number($('#f_cell_count').value),assembly=Number($('#f_assembly').value),other=Number($('#f_other').value);const total=Number.isFinite(cellPrice*cellCount+assembly+other)?cellPrice*cellCount+assembly+other:null;return {name:$('#f_name').value.trim(),model:$('#f_model').value.trim()||null,category_id:$('#f_cat').value,supplier:$('#f_supplier').value.trim()||null,price:$('#f_price').value===''?null:Number($('#f_price').value),moq:$('#f_moq').value===''?null:Number($('#f_moq').value),delivery:$('#f_delivery').value.trim()||null,carton:$('#f_carton').value.trim()||null,parameters:params,selling_points:selling,description:$('#f_desc').value.trim()||null,published:$('#f_pub').value==='true',uploader_nickname:$('#f_uploader').value.trim()||null,kit_price:$('#f_kit').value===''?null:Number($('#f_kit').value),cell_model:$('#f_cell_model').value.trim()||null,cell_count:$('#f_cell_count').value===''?null:Number($('#f_cell_count').value),actual_cell_capacity:$('#f_capacity').value===''?null:Number($('#f_capacity').value),cell_price:$('#f_cell_price').value===''?null:cellPrice,assembly_fee:$('#f_assembly').value===''?null:assembly,other_cost:$('#f_other').value===''?null:other,total_cost:total,updated_at:new Date().toISOString()}}
async function saveProduct(){if(!isAdmin())return toast('需要管理员权限','err');const d=formData();if(!d.name)return toast('产品名称必填','err');if(!d.category_id)return toast('分类必填','err');let id=state.editId;if(id){const {error}=await sb.from('products').update(d).eq('id',id);if(error)return toast('保存失败：'+error.message,'err')}else{const {data,error}=await sb.from('products').insert({...d,created_by:state.user.id}).select().single();if(error)return toast('创建失败：'+error.message,'err');id=data.id}
 const existing=state.media.filter(m=>m.product_id===id);for(let i=0;i<state.draftMedia.length;i++){const m=state.draftMedia[i],path=`${id}/${Date.now()}-${i}-${m.file.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,'_')}`;const up=await sb.storage.from('product-media').upload(path,m.file,{upsert:false});if(up.error)return toast('媒体上传失败：'+up.error.message,'err');const ins=await sb.from('product_media').insert({product_id:id,media_type:m.media_type,storage_path:path,sort_order:existing.length+i});if(ins.error)return toast('媒体记录失败：'+ins.error.message,'err')}
 state.draftMedia=[];await refreshData();closeModal();toast('产品保存成功')}
async function deleteProduct(id){if(!isAdmin())return;if(!confirm('确认删除这个产品及其媒体吗？'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)return toast('删除失败：'+error.message,'err');await refreshData();closeModal();toast('产品已删除')}
async function copyProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;const text=[`产品名称：${p.name}`,`型号：${p.model||''}`,`分类：${catName(p.category_id)}`,`供应商：${p.supplier||''}`,`价格：${p.price==null?'':p.price}`,`MOQ：${p.moq??''}`,`交期：${p.delivery||''}`,`包装/装箱：${p.carton||''}`,`参数：`,...Object.entries(p.parameters||{}).map(([k,v])=>`- ${k}：${v}`),`卖点：`,...(p.selling_points||[]).map((x,i)=>`${i+1}. ${x}`),`充电宝成本：`,p.total_cost!=null?`- 总成本：${p.total_cost}`:''].join('\n');try{await navigator.clipboard.writeText(text);toast('已复制完整产品信息')}catch(e){toast('复制失败，请检查浏览器剪贴板权限','err')}}
async function refreshData(){const [{data:prod},{data:med}]=await Promise.all([sb.from('products').select('*').order('updated_at',{ascending:false}),sb.from('product_media').select('*').order('sort_order')]);state.products=prod||[];state.media=med||[];render();refreshStats()}
function openAdmin(){if(!isAdmin())return;openModal(`<div class="modal-head"><div><h2>管理后台</h2><div class="muted">${roleLabel()} · ${esc(state.profile?.display_name||state.profile?.username||'')}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section"><h4>用户</h4><div id="users">加载中…</div></div><div class="section"><h4>联系与需求</h4><div id="messages">加载中…</div></div>`);loadAdmin()}
async function loadAdmin(){const {data:users,error}=await sb.from('profiles').select('id,username,display_name,role,muted,created_at').order('created_at');$('#users').innerHTML=error?`<div class="danger">${esc(error.message)}</div>`:`<div style="overflow:auto"><table class="table"><tr><th>账号</th><th>显示名</th><th>角色</th><th>状态</th>${state.role==='superadmin'?'<th>操作</th>':''}</tr>${(users||[]).map(u=>`<tr><td>${esc(u.username||'')}</td><td>${esc(u.display_name||'')}</td><td>${esc(u.role)}</td><td>${u.muted?'已禁言':'正常'}</td>${state.role==='superadmin'?`<td><button class="btn" onclick="toggleMute('${u.id}',${!u.muted})">${u.muted?'解除禁言':'禁言'}</button></td>`:''}</tr>`).join('')}</table></div>`;const {data:msgs}=await sb.from('contact_messages').select('*').order('created_at',{ascending:false});$('#messages').innerHTML=(msgs||[]).map(m=>`<div class="comment"><b>${esc(m.contact_way||'未留联系方式')}</b><div class="muted">${new Date(m.created_at).toLocaleString()}</div><p>${esc(m.body)}</p></div>`).join('')||'<div class="muted">暂无。</div>'}
async function toggleMute(id,val){if(state.role!=='superadmin')return;const {error}=await sb.from('profiles').update({muted:val,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message,'err');toast(val?'已禁言':'已解除禁言');loadAdmin()}
init().catch(e=>toast('初始化失败：'+e.message,'err'));
</script></body></html>
