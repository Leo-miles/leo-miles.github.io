*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#111}body{overflow-x:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.muted{color:#777;font-size:13px}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 82% 10%,#dceaff,transparent 35%),radial-gradient(circle at 10% 90%,#eadfff,transparent 32%),#f7f7f8}.card{background:rgba(255,255,255,.88);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.95);border-radius:28px;box-shadow:0 25px 80px #00000012}.login-card{width:min(430px,100%);padding:42px}.brand{text-align:center;margin-bottom:30px}.logo{width:52px;height:52px;background:#111;color:#fff;border-radius:16px;display:grid;place-items:center;margin:auto;font-weight:800}.brand h1{font-size:25px;margin:14px 0 6px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #e4e4e8;border-radius:12px;background:#fafafd;outline:0}.field textarea{min-height:100px;resize:vertical}.field textarea#specs{min-height:420px;line-height:1.7}.field input:focus,.field textarea:focus,.field select:focus{border-color:#999;box-shadow:0 0 0 4px #00000006}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700}.switch{text-align:center;margin-top:18px;font-size:12px;color:#777}.link{border:0;background:none;color:#111;font-weight:700;padding:0}.boot-note{margin-top:18px;text-align:center;font-size:12px;color:#888}.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:#fff;border-right:1px solid #e7e7eb;padding:24px 15px;z-index:10}.sidebrand{display:flex;align-items:center;gap:10px;font-weight:800;padding:0 10px 28px}.side-logo{width:35px;h ign-items:center;justify-content:center}.hero img,.hero video{width:100%;height:100%;object-fit:contain;background:#f0f1f2;display:block}.media-gallery{margin-top:14px;border:1px solid #e5e5e8;border-radius:20px;background:#fff;padding:16px}.media-gallery-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.media-gallery-head strong{font-size:14px}.media-gallery-head span{color:#999;font-size:12px;margin-left:6px}.gallery-toggle{border:1px solid #ddd;background:#fff;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;transition:transform .2s,box-shadow .2s}.gallery-toggle:hover{transform:translateY(-1px);box-shadow:0 8px 24px #0000000d}.gallery-display{position:relative;overflow:hidden}.image-stack{display:flex;position:relative;height:220px;overflow:hidden;border-radius:15px;background:#f6f6f7;align-items:center;justify-content:center;perspective:900px;max-height:220px;opacity:1;transform:scale(1);transition:max-height .5s cubic-bezier(.2,.8,.2,1),opacity .35s ease,transform .5s cubic-bezier(.2,.8,.2,1),margin .5s ease}.stack-card{position:absolute;width:min(58%,320px);height:190px;border-radius:15px;background:#fff;border:1px solid #e7e7eb;box-shadow:0 12px 35px #00000014;overflow:hidden;cursor:pointer;transition:transform .52s cubic-bezier(.2,.8,.2,1),opacity .4s ease,filter .4s ease}.stack-card img{width:100%;height:100%;object-fit:contain;background:#f0f1f2;display:block}.stack-1{transform:translateX(-110px) rotate(-8deg);z-index:1}.stack-2{transform:translateX(0) rotate(0);z-index:3}.stack-3{transform:translateX(110px) rotate(8deg);z-index:2}.stack-badge{position:absolute;right:12px;bottom:12px;z-index:5;background:#111;color:#fff;padding:7px 11px;border-radius:20px;font-size:12px;pointer-events:none}.image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:0;opacity:0;transform:translateY(16px) scale(.985);overflow:hidden;pointer-events:none;transition:max-height .55s cubic-bezier(.2,.8,.2,1),opacity .38s ease,transform .5s cubic-bezier(.2,.8,.2,1)}.image-grid-item{border:1px solid #e5e5e8;border-radius:14px;overflow:hidden;background:#f2f3f4;aspect-ratio:4/3;content-visibility:auto;contain-intrinsic-size:180px;cursor:pointer;transform:translateY(10px) scale(.97);transition:transform .42s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}.image-grid-item img{width:100%;height:100%;object-fit:contain;background:#f0f1f2;display:block}.image-grid-item:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 12px 30px #00000010}.gallery-display.expanded .image-stack{max-height:0;opacity:0;transform:translateY(-10px) scale(.96);pointer-events:none;margin:0}.gallery-display.expanded .image-grid{max-height:5000px;opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.gallery-display.expanded .image-grid-item{transform:translateY(0) scale(1)}.gallery-display.expanded .image-grid-item:nth-child(2){transition-delay:.03s}.gallery-display.expanded .image-grid-item:nth-child(3){transition-delay:.06s}.gallery-display.expanded .image-grid-item:nth-child(4){transition-delay:.09s}.gallery-display.expanded .image-grid-item:nth-child(5){transition-delay:.12s}.gallery-display.expanded .image-grid-item:nth-child(6){transition-delay:.15s}.gallery-note{margin-top:10px;font-size:12px;color:#888}.video-gallery{margin-top:15px;padding-top:15px;border-top:1px solid #eee}.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.video-grid-item{background:#f2f3f4;border-radius:14px;overflow:hidden;border:1px solid #e5e5e8}.video-grid-item video{width:100%;height:170px;display:block;object-fit:contain;background:#111}.video-grid-item div{padding:8px 10px;font-size:12px;color:#777}.detail h1{font-size:42px;letter-spacing:-1.5px;margin:10px 0}.bullets{padding:0;list-style:none}.bullets li{padding:12px 0;border-bottom:1px solid #eee}.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e8;border:1px solid #e5e5e8;border-radius:16p <body>
<div id="app"><div class="login"><div class="login-card card"><div class="brand"><div class="logo">LM</div><h1>LEOMILES</h1><div class="muted">Product Selection & Sales Hub</div></div><div class="boot-note">正在加载产品中心…</div></div></div></div>
<script>
let db=null,products=[],role=null,user=null,view='products',selected=null,editingProduct=null,pendingImages=[],pendingVideos=[],removedMediaIds=[],autoSaveTimer=null,galleryExpanded=false;
const DRAFT_KEY=()=>`leomiles_product_draft_${user?.id||'guest'}_${editingProduct?.id||'new'}`;
const DB_NAME='leomiles-product-hub';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>n==null||n===''?'—':'¥'+Number(n).toFixed(2);
const publicUrl=path=>db.storage.from('product-media').getPublicUrl(path).data.publicUrl;
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function showBootError(message){document.getElementById('app').innerHTML='<div class="login"><div class="login-card card"><div class="brand"><div class="logo">LM</div><h1>LEOMILES</h1><div class="error-box">'+esc(message)+'</div></div></div></div>'}
let dbOpenPromise=null;function dbOpen(){if(dbOpenPromise)return dbOpenPromise;dbOpenPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('draftFiles'))r.result.createObjectStore('draftFiles',{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>{dbOpenPromise=null;reject(r.error)}});return dbOpenPromise}
async function idbPutFiles(kind,files){if(!files.length)return;try{const d=await dbOpen(),tx=d.transaction('draftFiles','readwrite'),s=tx.objectStore('draftFiles');for(const f of files)s.put({key:`${DRAFT_KEY()}_${kind}_${crypto.randomUUID()}`,kind,name:f.name,type:f.type,size:f.size,lastModified:f.lastModified,file:f});return new Promise(res=>tx.oncomplete=res)}catch(e){console.warn('IDB save failed',e)}}
async function idbGetFiles(){try{const d=await dbOpen();return new Promise((resolve,reject)=>{const out=[],tx=d.transaction('draftFiles','readonly'),s=tx.objectStore('draftFiles'),req=s.openCursor();req.onsuccess=ev=>{const c=ev.target.result;if(!c)return resolve(out.filter(x=>x.key.startsWith(DRAFT_KEY())));out.push(c.value);c.continue()};req.onerror=()=>reject(req.error)})}catch(e){return[]}}
async function idbClearDraft(){try{const d=await dbOpen();const tx=d.transaction('draftFiles','readwrite'),s=tx.objectStore('draftFiles'),req=s.openCursor();req.onsuccess=ev=>{const c=ev.target.result;if(!c)return;if(c.value.key.startsWith(DRAFT_KEY()))s.delete(c.primaryKey);c.continue()}}catch(e){console.warn('IDB clear failed',e)}}
function formSnapshot(){const g=id=>document.getElementById(id)?.value??'';return {pname:g('pname'),sku:g('sku'),category:g('category'),desc:g('desc'),purchase:g('purchase'),suggested:g('suggested'),moq:g('moq'),supplier:g('supplier'),notes:g('notes'),specs:g('specs'),highlights:[...document.querySelectorAll('.highlight')].map(x=>x.value)}}
function saveDraftNow(){const form=document.getElementById('uploadForm');if(!form)return;try{localStorage.setItem(DRAFT_KEY(),JSON.stringify(formSnapshot()));const st=document.getElementById('saveState');if(st)st.textContent='已自动保存'}catch(e){}}
function scheduleDraftSave(){const st=document.getElementById('saveState');if(st)st.textContent='正在保存…';clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(saveDraftNow,500)}
function getStoredDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY())||'null')}catch(e){return null}}
function clearStoredDraft(){try{localStorage.removeItem(DRAFT_KEY())}catch(e){}}
function applyDraft(d){if(!d)return;const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.value=v};Object.entries({pname:d.pname,sku:d.sku,category:d.category,desc:d.desc,purchase:d.purchase,suggested:d.suggested,moq:d.moq,supplier:d.supplier,notes:d.notes,specs:d.specs}).forEach(([k,v])=>set(k,v));document.querySelectorAll('.highlight').forEach((x,i)=>x.value=d.highlights?.[i]??'')}
function login(){document.getElementById('app').innerHTML='<div class="login"><div class="login-card card"><div class="brand"><div class="logo">LM</div><h1>LEOMILES</h1><div class="muted">Product Selection & Sales Hub</div></div><form onsubmit="signIn(event)"><div class="field"><label>邮箱</label><input id="email" type="email" required placeholder="name@example.com"></div><div class="field"><label>密码</label><input id="password" type="password" required placeholder="请输入密码"></div><button class="primary">登录</button></form><div class="switch">还没有账号？ <button class="link" type="button" onclick="signupForm()">创建账号</button></div></div></div>'}
function signupForm(){document.querySelector('.login-card').innerHTML='<div class="brand"><div class="logo">LM</div><h1>创建账号</h1><div class="muted">加入 LEOMILES 产品中心</div></div><form onsubmit="signUp(event)"><div class="field"><label>邮箱</label><input id="email" type="email" required></div><div class="field"><label>密码</label><input id="password" type="password" minlength="6" required></div><button class="primary">注册</button></form><div class="switch"><button class="link" type="button" onclick="login()">返回登录</button></div>'}
async function signIn(e){e.preventDefault();const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)toast(error.message)}
async function signUp(e){e.preventDefault();const {error}=await db.auth.signUp({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)toast(error.message);else toast('注册成功，请检查邮箱')}
async function loadProfile(){const {data,error}=await db.from('profiles').select('display_name,role').eq('id',user.id).single();if(error){role='sales';toast('读取用户权限失败：'+error.message)}else role=data?.role||'sales'}
function shell(content){document.getElementById('app').innerHTML='<div class="app"><aside class="sidebar"><div class="sidebrand"><div class="side-logo">LM</div><span>LEOMILES</span></div><div class="muted" style="padding:0 12px 8px">工作区</div><div class="nav"><button class="'+(view==='products'?'active':'')+'" onclick="go(\'products\')">▦ <span>产品库</span></button>'+(role==='admin'||role==='selector'?'<button class="'+(view==='upload'?'active':'')+'" onclick="newProduct()">＋ <span>上传产品</span></button>':'')+'<button class="'+(view==='sales'?'active':'')+'" onclick="go(\'sales\')">◈ <span>销售端</span></button></div><div class="logout"><button class="nav" onclick="db.auth.signOut()">退出登录</button></div></aside><main class="main"><header class="top"><div class="muted">LEOMILES / '+esc(view==='products'?'产品库':view==='upload'?(editingProduct?'修改产品':'上传产品'):view==='detail'?'产品详情':'销售端')+'</div><div class="user"><span>'+esc(role==='selector'?'选品人员':role==='admin'?'管理员':'销售人员')+'</span><div class="avatar">'+esc((user?.email||'L')[0].toUpperCase())+'</div></div></header>'+content+'</main></div>'}
let productsCacheAt=0;let productsCacheRole=null;async function loadProducts(force=false){const now=Date.now();if(!force&&productsCacheRole===role&&now-productsCacheAt<8000&&products.length)return products;let q=db.from('products').select('id,name,sku,category,description,highlights,specs,purchase_price,suggested_price,moq,supplier,internal_notes,status,created_by,updated_by,updated_at,product_media(id,product_id,storage_path,media_type,sort_order)').order('updated_at',{ascending:false});if(role==='sales')q=q.eq('status','published');const {data,error}=await q;if(error){toast(error.message);return[]};products=data||[];productsCacheAt=Date.now();productsCacheRole=role;return products}
function firstMedia(p){return (p.product_media||[]).slice().sort((a,b)=>a.sort_order-b.sort_order)[0]||null}
function card(p){const m=firstMedia(p),url=m?publicUrl(m.storage_path):null;const visual=url?(m.media_type==='video'?'<video src="'+esc(url)+'" muted playsinline preload="none"></video>':'<img loading="lazy" decoding="async" src="'+esc(url)+'" alt="产品图片">'):'<div class="mock">'+esc(p.sku||'NEW')+'</div>';const manage=(role==='admin'||role==='selector')?'<button class="tiny" onclick="editProduct(\''+p.id+'\')">修改</button>'+(role==='admin'?'<button class="tiny danger" onclick="deleteProduct(\''+p.id+'\')">删除</button>':''):'';return '<article class="product"><div class="pimg">'+visual+'</div><div class="pbody"><span class="tag">● '+esc(p.status==='published'?'已发布':'草稿')+'</span><h3>'+esc(p.name)+'</h3><p>'+esc((p.description||'').slice(0,80))+'</p><div class="row"><span class="price">'+money(p.suggested_price??p.purchase_price)+'</span><button class="more" onclick="openDetail(\''+p.id+'\')">查看详情 →</button></div><div class="card-actions">'+manage+'<button class="tiny dark" onclick="copyProductSpecs(\''+p.id+'\')">复制产品参数</button></div></div></article>'}
let filterTimer=null;function filterProducts(q){clearTimeout(filterTimer);filterTimer=setTimeout(()=>{const term=q.toLowerCase().trim();const a=products.filter(p=>(p.name+' '+(p.sku||'')+' '+(p.description||'')).toLowerCase().includes(term));const grid=document.getElementById('grid');if(!grid)return;grid.innerHTML=a.length?a.map(card).join(''):'<div class="empty">没有找到匹配产品</div>'},90)}
async function productsPage(){const list=await loadProducts();shell('<div class="page"><div class="head"><div><h2>产品库</h2><p class="muted">产品资料统一管理，支持修改、删除和一键复制参数。</p></div>'+(role==='admin'||role==='selector'?'<button class="btn dark" onclick="newProduct()">＋ 上传产品</button>':'')+'</div><div class="toolbar"><div class="search"><input placeholder="搜索产品名称、编号、关键词……" oninput="filterProducts(this.value)"></div><div class="chips"><button class="chip active">全部</button><button class="chip">3C数码</button><button class="chip">小家电</button><button class="chip">美容健康</button></div></div><div id="grid" class="grid">'+(list.length?list.map(card).join(''):'<div class="empty">还没有产品</div>')+'</div></div>')}
function resetPending(){pendingImages=[];pendingVideos=[];removedMediaIds=[]}
function previewImageFiles(files){const valid=[...files].filter(f=>f.type.startsWith('image/'));pendingImages=[...pendingImages,...valid];renderImagePreviews();idbPutFiles('image',valid);scheduleDraftSave()}
function previewVideoFiles(files){const valid=[...files].filter(f=>f.type.startsWith('video/'));pendingVideos=[...pendingVideos,...valid];renderVideoPreviews();idbPutFiles('video',valid);scheduleDraftSave()}
function renderImagePreviews(){const el=document.getElementById('imagePreviews');if(!el)return;el.innerHTML=pendingImages.map((f,i)=>'<div class="preview-wrap"><img class="preview" src="'+URL.createObjectURL(f)+'"><button type="button" class="remove-preview" onclick="removeImage('+i+')">×</button></div>').join('')}
function renderVideoPreviews(){const el=document.getElementById('videoPreviews');if(!el)return;el.innerHTML=pendingVideos.map((f,i)=>'<div class="preview-wrap"><video class="preview" src="'+URL.createObjectURL(f)+'" muted></video><button type="button" class="remove-preview" onclick="removeVideo('+i+')">×</button><div class="video-meta">'+esc(f.name)+'</div></div>').join('')}
function removeImage(i){pendingImages.splice(i,1);renderImagePreviews();scheduleDraftSave()}
function removeVideo(i){pendingVideos.splice(i,1);renderVideoPreviews();scheduleDraftSave()}
function handlePaste(e){if(!document.getElementById('uploadForm'))return;const files=[...e.clipboardData.files].filter(f=>f.type.startsWith('image/'));if(files.length){e.preventDefault();previewImageFiles(files);toast('已粘贴 '+files.length+' 张图片')}}
let pasteHandlerBound=false;function bindUploadArea(){const dz=document.getElementById('imageDrop'),vz=document.getElementById('videoDrop');const bind=(zone,handler,inputId)=>{zone.addEventListener('click',()=>document.getElementById(inputId).click());zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag')});zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');handler(e.dataTransfer.files)})};bind(dz,previewImageFiles,'images');bind(vz,previewVideoFiles,'videos');document.getElementById('images').addEventListener('change',e=>previewImageFiles(e.target.files));document.getElementById('videos').addEventListener('change',e=>previewVideoFiles(e.target.files));document.getElementById('uploadForm').addEventListener('input',scheduleDraftSave);if(!pasteHandlerBound){document.addEventListener('paste',handlePaste);pasteHandlerBound=true}}
async function restoreDraft(){const stored=getStoredDraft();if(stored)applyDraft(stored);const files=await idbGetFiles();pendingImages=files.filter(x=>x.kind==='image').map(x=>x.file);pendingVideos=files.filter(x=>x.kind==='video').map(x=>x.file);renderImagePreviews();renderVideoPreviews();const st=document.getElementById('saveState');if(st&&stored)st.textContent='已恢复上次编辑内容'}
async function uploadOne(file,pid,sort,type){const safe=file.name.replace(/[^\w.\-\u4e00-\u9fff]+/g,'_');const path=user.id+'/'+pid+'/'+crypto.randomUUID()+'-'+safe;const up=await db.storage.from('product-media').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;const ins=await db.from('product_media').insert({product_id:pid,storage_path:path,media_type:type,sort_order:sort});if(ins.error)throw ins.error}
function parseSpecs(){const raw=document.getElementById('specs')?.value||'';const out={};raw.split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const m=line.split(/[:：]/);if(m.length>=2){const k=m.shift().trim();out[k]=m.join(':').trim()}});return out}
function specsObject(s){if(!s)return{};if(typeof s==='string'){const out={};s.split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const m=line.split(/[:：]/);if(m.length>=2){const k=m.shift().trim();out[k]=m.join(':').trim()}});return out}return s&&typeof s==='object'?s:{}}
function specsToText(s){return Object.entries(specsObject(s)).map(([k,v])=>k+'：'+v).join('\n')}
function uploadPage(){const p=editingProduct;const stored=getStoredDraft();shell('<div class="page upload"><div class="head"><div><h2>'+esc(p?'修改产品':'上传产品')+'</h2><p class="muted">关闭标签、切换页面或刷新后，文字与待上传素材都会保留。</p></div><div class="muted" id="saveState">'+(stored?'检测到自动保存内容':'自动保存已开启')+'</div></div>'+(stored?'<div class="draft-box"><span>检测到本产品有未完成的编辑内容，系统已自动保留。</span><button class="tiny" type="button" onclick="clearAndReloadDraft()">清除草稿</button></div>':'')+'<form id="uploadForm" onsubmit="saveProduct(event)"><div class="section"><h3>基本信息</h3><div class="two"><div class="field"><label>产品名称</label><input id="pname" required value="'+esc(p?.name||'')+'" placeholder="例如：L291 筋膜枪"></div><div class="field"><label>产品编号</label><input id="sku" value="'+esc(p?.sku||'')+'" placeholder="例如：L291"></div></div><div class="field"><label>产品分类</label><select id="category"><option '+(p?.category==='美容健康'?'selected':'')+'>美容健康</option><option '+(p?.category==='3C数码'?'selected':'')+'>3C数码</option><option '+(p?.category==='小家电'?'selected':'')+'>小家电</option><option '+(p?.category==='户外'?'selected':'')+'>户外</option><option '+(p?.category==='其他'?'selected':'')+'>其他</option></select></div><div class="field"><label>产品简介</label><textarea id="desc" placeholder="产品定位、使用场景、核心介绍">'+esc(p?.description||'')+'</textarea></div></div><div class="section"><h3>产品图片</h3>'+(p?.product_media?.filter(m=>m.media_type==='image').length?'<div class="previews">'+p.product_media.filter(m=>m.media_type==='image').sort((a,b)=>a.sort_order-b.sort_order).map(m=>'<div class="preview-wrap"><img class="preview" src="'+esc(publicUrl(m.storage_path))+'"><button type="button" class="remove-preview" onclick="stageRemoveMedia(\''+m.id+'\')">×</button></div>').join('')+'</div><div class="hint">现有图片点击 × 后，保存修改时删除。</div>':'')+'<div id="imageDrop" class="drop"><strong>⌘＋V / ＋</strong><div>点击选择或直接粘贴产品图片</div><small>支持 JPG / PNG / WEBP、拖拽和 Ctrl + V，可一次粘贴多张</small><input id="images" type="file" accept="image/*" multiple style="display:none"></div><div id="imagePreviews" class="previews"></div></div><div class="section"><h3>产品视频</h3>'+(p?.product_media?.filter(m=>m.media_type==='video').length?'<div class="previews">'+p.product_media.filter(m=>m.media_type==='video').sort((a,b)=>a.sort_order-b.sort_order).map(m=>'<div class="preview-wrap"><video class="preview" src="'+esc(publicUrl(m.storage_path))+'" controls muted></video><button type="button" class="remove-preview" onclick="stageRemoveMedia(\''+m.id+'\')">×</button><div class="video-meta">现有视频</div></div>').join('')+'</div>':'')+'<div id="videoDrop" class="drop"><strong>▶＋</strong><div>点击选择或拖拽产品视频</div><small>支持浏览器常见视频格式；建议控制单个视频体积</small><input id="videos" type="file" accept="video/*" multiple style="display:none"></div><div id="videoPreviews" class="previews"></div></div><div class="section"><h3>核心卖点</h3><div class="field"><input class="highlight" placeholder="卖点 1" value="'+esc(p?.highlights?.[0]||'')+'"></div><div class="field"><input class="highlight" placeholder="卖点 2" value="'+esc(p?.highlights?.[1]||'')+'"></div><div class="field"><input class="highlight" placeholder="卖点 3" value="'+esc(p?.highlights?.[2]||'')+'"></div></div><div class="section"><h3>产品参数</h3><div class="field"><textarea id="specs" placeholder="例如：电池容量：2400mAh\n档位：4档\n重量：480g">'+esc(specsToText(p?.specs))+'</textarea></div><div class="hint">一行一个参数，格式：参数名：参数值。保存后，产品卡可直接复制这些参数。</div></div><div class="section"><h3>价格与供应</h3><div class="two"><div class="field"><label>采购价</label><input id="purchase" type="number" step="0.01" value="'+esc(p?.purchase_price??'')+'" placeholder="0.00"></div><div class="field"><label>建议销售价</label><input id="suggested" type="number" step="0.01" value="'+esc(p?.suggested_price??'')+'" placeholder="0.00"></div><div class="field"><label>MOQ</label><input id="moq" type="number" min="0" value="'+esc(p?.moq??'')+'" placeholder="0"></div><div class="field"><label>供应商</label><input id="supplier" value="'+esc(p?.supplier||'')+'" placeholder="供应商名称"></div></div><div class="field"><label>内部备注</label><textarea id="notes" placeholder="仅管理员和选品人员可见">'+esc(p?.internal_notes||'')+'</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="go(\'products\')">取消</button><button class="btn dark">'+(p?'保存修改':'保存并发布')+'</button></div></form></div>');bindUploadArea();setTimeout(restoreDraft,0)}
function clearAndReloadDraft(){clearStoredDraft();idbClearDraft();location.reload()}
function stageRemoveMedia(id){if(!removedMediaIds.includes(id))removedMediaIds.push(id);document.querySelectorAll('[onclick="stageRemoveMedia(\''+id+'\')"]').forEach(b=>{b.parentElement.style.opacity='.35';b.disabled=true});toast('已标记，保存修改后删除')}
function newProduct(){editingProduct=null;selected=null;view='upload';uploadPage()}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingProduct=p;selected=p;view='upload';uploadPage()}
async function saveProduct(e){e.preventDefault();if(role!=='admin'&&role!=='selector')return toast('当前账号没有操作权限');const isEditing=!!editingProduct;const btn=e.submitter;btn.disabled=true;btn.textContent='正在保存…';try{const highlights=[...document.querySelectorAll('.highlight')].map(x=>x.value.trim()).filter(Boolean);const payload={name:document.getElementById('pname').value.trim(),sku:document.getElementById('sku').value.trim()||null,category:document.getElementById('category').value,description:document.getElementById('desc').value.trim()||null,highlights,specs:parseSpecs(),purchase_price:document.getElementById('purchase').value===''?null:Number(document.getElementById('purchase').value),suggested_price:document.getElementById('suggested').value===''?null:Number(document.getElementById('suggested').value),moq:document.getElementById('moq').value===''?null:Number(document.getElementById('moq').value),supplier:document.getElementById('supplier').value.trim()||null,internal_notes:document.getElementById('notes').value.trim()||null,updated_by:user.id};let p;if(isEditing){const {data,error}=await db.from('products').update(payload).eq('id',editingProduct.id).select().single();if(error)throw error;p=data;for(const id of removedMediaIds){const m=(editingProduct.product_media||[]).find(x=>x.id===id);if(m){const sr=await db.storage.from('product-media').remove([m.storage_path]);if(sr.error)throw sr.error;const dr=await db.from('product_media').delete().eq('id',id);if(dr.error)throw dr.error}}}else{payload.status='published';payload.created_by=user.id;const {data,error}=await db.from('products').insert(payload).select().single();if(error)throw error;p=data}let existingMedia=(isEditing?editingProduct.product_media||[]:[]).filter(m=>!removedMediaIds.includes(m.id));let sort=Math.max(-1,...existingMedia.map(m=>m.sort_order))+1;for(const f of pendingImages)await uploadOne(f,p.id,sort++,'image');for(const f of pendingVideos)await uploadOne(f,p.id,sort++,'video');const {data:fresh,error:ferr}=await db.from('products').select('*,product_media(*)').eq('id',p.id).single();if(ferr)throw ferr;p=fresh;clearStoredDraft();await idbClearDraft();resetPending();selected=p;editingProduct=null;products=products.filter(x=>x.id!==p.id);products.unshift(p);productsCacheAt=0;productsCacheRole=null;toast(isEditing?'产品已修改并保存':'产品已保存并发布');view='products';await productsPage()}catch(err){console.error(err);toast(err.message||'保存失败')}finally{btn.disabled=false;btn.textContent=isEditing?'保存修改':'保存并发布'}}
async function deleteProduct(id){if(role!=='admin')return toast('只有管理员可以删除产品');const p=products.find(x=>x.id===id);if(!p)return;if(!confirm('确定删除「'+p.name+'」吗？产品图片和视频也会一起删除。'))return;try{const media=p.product_media||[];if(media.length){const r=await db.storage.from('product-media').remove(media.map(m=>m.storage_path));if(r.error)throw r.error}const {error}=await db.from('products').delete().eq('id',id);if(error)throw error;products=products.filter(x=>x.id!==id);productsCacheAt=0;productsCacheRole=null;toast('产品已删除');productsPage()}catch(e){toast(e.message||'删除失败')}}
function openDetail(id){const p=products.find(x=>x.id===id);if(!p)return;selected=p;view='detail';galleryExpanded=false;detailPage(p)}
function detailPage(p){const media=(p.product_media||[]).slice().sort((a,b)=>a.sort_order-b.sort_order),images=media.filter(m=>m.media_type==='image'),videos=media.filter(m=>m.media_type==='video'),publicSales=role==='sales',rows=[['分类',p.category],['SKU',p.sku],['MOQ',p.moq],['建议售价',money(p.suggested_price)]];if(!publicSales)rows.push(['采购价',money(p.purchase_price)],['供应商',p.supplier]);const bullets=(p.highlights||[]).map(h=>'<li>'+esc(h)+'</li>').join('');const hero=media[0]?renderHeroMedia(media[0]):'<div class="mock">'+esc(p.sku||'NEW')+'</div>';const stacked=images.slice(0,3).map((m,i)=>'<div class="stack-card stack-'+(i+1)+'" onclick="showMedia('+media.indexOf(m)+')"><img loading="lazy" decoding="async" src="'+esc(publicUrl(m.storage_path))+'" alt="产品图片"></div>').join('');const imageGrid=images.map(m=>'<div class="image-grid-item" onclick="showMedia('+media.indexOf(m)+')"><img loading="lazy" decoding="async" src="'+esc(publicUrl(m.storage_path))+'" alt="产品图片"></div>').join('');const gallery=images.length?'<div class="media-gallery"><div class="media-gallery-head"><div><strong>产品图片</strong><span>'+images.length+' 张</span></div><button id="galleryToggle" class="gallery-toggle" type="button" onclick="toggleImageGallery()">展开全部图片</button></div><div id="galleryDisplay" class="gallery-display"><div id="imageStack" class="image-stack">'+stacked+'<div class="stack-badge">'+images.length+' 张图片</div></div><div id="imageGrid" class="image-grid">'+imageGrid+'</div></div><div class="gallery-note">默认以叠放方式展示，点击“展开全部图片”后一次查看所有图片。</div></div>':'';const videoGallery=videos.length?'<div class="video-gallery"><div class="media-gallery-head"><div><strong>产品视频</strong><span>'+videos.length+' 个</span></div></div><div class="video-grid">'+videos.map((m,i)=>'<div class="video-grid-item"><video controls playsinline preload="none" src="'+esc(publicUrl(m.storage_path))+'"></video><div>视频 '+(i+1)+'</div></div>').join('')+'</div></div>':'';shell('<div class="page"><div class="head"><div><button class="btn" onclick="go(\'products\')">← 返回产品库</button></div><div class="card-actions">'+((role==='admin'||role==='selector')?'<button class="btn" onclick="editProduct(\''+p.id+'\')">修改</button>':'')+(role==='admin'?'<button class="btn danger" onclick="deleteProduct(\''+p.id+'\')">删除</button>':'')+'<button class="btn dark" onclick="copyProductSpecs(\''+p.id+'\')">一键复制参数</button></div></div><div class="detail" style="margin-top:22px"><div><div id="hero" class="hero">'+hero+'</div>'+gallery+videoGallery+'</div><div><span class="tag">● '+esc(p.status==='published'?'已发布':'草稿')+'</span><h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.description||'')+'</p><ul class="bullets">'+bullets+'</ul><div class="spec-grid">'+rows.map(r=>'<div><small>'+esc(r[0])+'</small><b>'+esc(r[1]??'—')+'</b></div>').join('')+'</div>'+(Object.keys(specsObject(p.specs)).length?'<div class="section" style="margin-top:18px"><h3>产品参数</h3><div class="spec-grid">'+Object.entries(specsObject(p.specs)).map(([k,v])=>'<div><small>'+esc(k)+'</small><b>'+esc(v)+'</b></div>').join('')+'</div></div>':'')+'</div></div></div>');window.currentDetailMedia=media}
function renderHeroMedia(m){const url=publicUrl(m.storage_path);return m.media_type==='video'?'<video controls playsinline preload="metadata" src="'+esc(url)+'"></video>':'<img src="'+esc(url)+'" alt="产品图片">'}
function showMedia(i){const m=window.currentDetailMedia?.[i];if(m)document.getElementById('hero').innerHTML=renderHeroMedia(m)}
function toggleImageGallery(){const box=document.getElementById('galleryDisplay'),btn=document.getElementById('galleryToggle');if(!box||!btn)return;galleryExpanded=!galleryExpanded;box.classList.toggle('expanded',galleryExpanded);btn.textContent=galleryExpanded?'收起图片':'展开全部图片'}
async function salesPage(){const list=await loadProducts();shell('<div class="page"><div class="saleshero"><h2>销售端</h2><p>这里只展示已发布的产品、卖点、参数、销售价格以及产品素材。</p></div><div class="grid">'+(list.length?list.map(card).join(''):'<div class="empty">暂无已发布产品</div>')+'</div></div>')}
function go(v){if(view==='upload')saveDraftNow();view=v;if(v==='products')productsPage();else if(v==='upload')uploadPage();else if(v==='sales')salesPage();else if(v==='detail'&&selected)detailPage(selected)}
async function copyProductSpecs(id){const p=products.find(x=>x.id===id)||selected;if(!p)return;const specs=specsObject(p.specs);const entries=Object.entries(specs).filter(([k,v])=>String(k).trim()&&String(v).trim()!=='');if(!entries.length){toast('这个产品还没有填写产品参数');return}const text='产品参数\n'+entries.map(([k,v])=>k+'：'+v).join('\n');try{await navigator.clipboard.writeText(text);toast('产品参数已复制')}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('产品参数已复制')}}
async function boot(){try{if(!window.supabase)throw new Error('Supabase JS 没有加载成功，请刷新页面或检查网络/CDN。');if(!window.LEOMILES_SUPABASE_URL||!window.LEOMILES_SUPABASE_PUBLISHABLE_KEY)throw new Error('Supabase 配置文件未加载，请检查 supabase-config.js。');db=supabase.createClient(window.LEOMILES_SUPABASE_URL,window.LEOMILES_SUPABASE_PUBLISHABLE_KEY);const {data}=await db.auth.getSession();user=data.session?.user||null;if(user){await loadProfile();render()}else login();db.auth.onAuthStateChange(async(_event,session)=>{user=session?.user||null;if(user){await loadProfile();render()}else login()})}catch(e){console.error(e);showBootError(e.message||'页面启动失败')}}
function render(){if(view==='products')productsPage();else if(view==='upload')uploadPage();else if(view==='detail'&&selected)detailPage(selected);else salesPage()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveDraftNow()});window.addEventListener('beforeunload',saveDraftNow);
boot();
</script>
</body>
