<title>LEOMILES · Product Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#111}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#dceaff,transparent 35%),radial-gradient(circle at 10% 90%,#eadfff,transparent 32%),#f7f7f8}.card{background:rgba(255,255,255,.84);backdrop-filter:blur(25px);border:1px solid #fff;border-radius:28px;box-shadow:0 25px 80px #00000012}.login-card{width:min(420px,calc(100% - 32px));padding:42px}.brand{text-align:center;margin-bottom:30px}.logo{width:50px;height:50px;background:#111;color:#fff;border-radius:15px;display:grid;place-items:center;margin:auto;font-weight:800}.brand h1{font-size:24px;margin:14px 0 6px}.muted{color:#777;font-size:13px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #e4e4e8;border-radius:12px;background:#fafafd;outline:0}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#999;box-shadow:0 0 0 4px #00000006}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700}.switch{text-align:center;margin-top:18px;font-size:12px;color:#777}.link{border:0;background:none;color:#111;font-weight:700}.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:#fff;border-right:1px solid #e7e7eb;padding:24px 15px}.sidebrand{display:flex;align-items:center;gap:10px;font-weight:800;padding:0 10px 28px}.side-logo{width:35px;height:35px;background:#111;color:#fff;border-radius:10px;display:grid;place-items:center;font-size:12px}.nav button{width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:11px;color:#666;margin:2px 0}.nav button.active,.nav button:hover{background:#f0f0f2;color:#111;font-weight:650}.logout{position:absolute;bottom:20px;left:15px;right:15px}.main{margin-left:230px}.top{height:72px;background:#ffffffdd;backdrop-filter:blur(18px);border-bottom:1px solid #e7e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.user{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:12px}.page{max-width:1400px;margin:auto;padding:34px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.head h2{margin:0;font-size:32px;letter-spacing:-1px}.head p{margin:7px 0 0}.btn{border:1px solid #ddd;background:#fff;border-radius:11px;padding:11px 16px;font-weight:650}.btn.dark{background:#111;color:#fff;border-color:#111}.toolbar{display:flex;gap:10px;margin-bottom:22px}.search{flex:1;max-width:480px}.search input{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:12px;background:#fff}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:0;background:#fff;padding:9px 13px;border-radius:20px;color:#777}.chip.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.product{background:#fff;border:1px solid #e7e7eb;border-radius:20px;overflow:hidden;transition:.25s}.product:hover{transform:translateY(-4px);box-shadow:0 15px 45px #0000000c}.pimg{height:250px;background:linear-gradient(135deg,#eef0f3,#fafafa);display:grid;place-items:center;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:cover}.mock{font-size:48px;font-weight:800;color:#aaa}.pbody{padding:18px}.tag{display:inline-block;background:#edf9f1;color:#219653;padding:5px 8px;border-radius:20px;font-size:11px}.pbody h3{margin:11px 0 5px}.pbody p{margin:0 0 15px;color:#777;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:800}.more{border:0;background:none;font-weight:700}.upload{max-width:950px}.section{background:#fff;border:1px solid #e7e7eb;border-radius:20px;padding:25px;margin-bottom:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.drop{border:1.5px dashed #ccc;border-radius:18px;padding:28px;text-align:center;background:#fafafa;transition:.2s}.drop.drag{border-color:#111;background:#f1f1f1}.drop strong{font-size:28px;display:block}.drop small{display:block;color:#888;margin-top:7px}.upload-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.mini-btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 13px;font-weight:650}.previews{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.preview-wrap{position:relative;width:110px}.preview{width:110px;height:85px;border-radius:10px;background:#eee;object-fit:cover;display:block}.preview-video{height:85px}.remove-preview{position:absolute;top:5px;right:5px;border:0;background:#111;color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px}.video-meta{font-size:11px;color:#777;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{margin-top:10px;color:#777;font-size:12px;line-height:1.6}.actions{display:flex;justify-content:flex-end;gap:10px}.detail{display:grid;grid-template-columns:1.1fr .9fr;gap:35px}.hero{min-height:540px;border-radius:25px;background:#eef0f2;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}.hero img,.hero video{width:100%;height:100%;max-height:620px;object-fit:contain;background:#f0f1f2}.hero video{object-fit:contain}.media-stack{display:grid;gap:12px}.media-nav{display:flex;gap:8px;overflow:auto}.media-nav button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:7px 10px;font-size:12px}.detail h1{font-size:42px;letter-spacing:-1.5px;margin:10px 0}.bullets{padding:0;list-style:none}.bullets li{padding:12px 0;border-bottom:1px solid #eee}.info{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e5e5e8;border-radius:16px;overflow:hidden;margin-top:25px}.info div{padding:14px;background:#fff;border-bottom:1px solid #eee}.info small{display:block;color:#999;margin-bottom:4px}.saleshero{background:#111;color:#fff;border-radius:27px;padding:38px;margin-bottom:25px}.saleshero h2{font-size:34px;margin:0 0 8px}.saleshero p{color:#aaa}.empty{text-align:center;padding:80px;color:#888}.toast{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:13px 17px;border-radius:12px;z-index:20}.danger{color:#d93025}.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e8;border:1px solid #e5e5e8;border-radius:16px;overflow:hidden}.spec-grid div{padding:12px;background:#fff}.spec-grid small{display:block;color:#999;margin-bottom:4px}@media(max-width:900px){.sidebar{width:72px}.sidebrand span,.nav button span{display:none}.main{margin-left:72px}.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}}@media(max-width:620px){.sidebar{display:none}.main{margin:0}.top{padding:0 18px}.page{padding:20px}.grid,.two{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{max-width:none}.head{align-items:start;gap:15px}.detail h1{font-size:34px}.hero{min-height:380px}}
</style>
</head>
<body><div id="app"></div>
<script>
const {createClient}=supabase;const db=createClient(window.LEOMILES_SUPABASE_URL,window.LEOMILES_SUPABASE_PUBLISHABLE_KEY);let products=[],role=null,user=null,view='products',selected=null;let pendingImages=[],pendingVideos=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>n==null||n===''?'—':'¥'+Number(n).toFixed(2);
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
async function init(){const {data}=await db.auth.getSession();user=data.session?.user||null;if(user)await loadProfile();else login();db.auth.onAuthStateChange(async()=>{const r=await db.auth.getSession();user=r.data.session?.user||null;if(user){await loadProfile();render()}else login()})}
async function loadProfile(){const {data,error}=await db.from('profiles').select('display_name,role').eq('id',user.id).single();if(error)toast(error.message);role=data?.role||'sales'}
function login(){document.getElementById('app').innerHTML='<div class="login"><div class="login-card card"><div class="brand"><div class="logo">LM</div><h1>LEOMILES</h1><div class="muted">Product Selection & Sales Hub</div></div><form onsubmit="signIn(event)"><div class="field"><label>邮箱</label><input id="email" type="email" required placeholder="name@example.com"></div><div class="field"><label>密码</label><input id="password" type="password" required placeholder="请输入密码"></div><button class="primary">登录</button></form><div class="switch">还没有账号？ <button class="link" onclick="signupForm()">创建账号</button></div></div></div>'}
function signupForm(){document.querySelector('.login-card').innerHTML='<div class="brand"><div class="logo">LM</div><h1>创建账号</h1><div class="muted">加入 LEOMILES 产品中心</div></div><form onsubmit="signUp(event)"><div class="field"><label>邮箱</label><input id="email" type="email" required></div><div class="field"><label>密码</label><input id="password" type="password" minlength="6" required></div><button class="primary">注册</button></form><div class="switch"><button class="link" onclick="login()">返回登录</button></div>'}
async function signIn(e){e.preventDefault();const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)toast(error.message);else toast('登录成功')}
async function signUp(e){e.preventDefault();const {error}=await db.auth.signUp({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)toast(error.message);else toast('注册成功，请检查邮箱')}
function shell(content){document.getElementById('app').innerHTML='<div class="app"><aside class="sidebar"><div class="sidebrand"><div class="side-logo">LM</div><span>LEOMILES</span></div><div class="muted" style="padding:0 12px 8px">工作区</div><div class="nav"><button class="'+(view==='products'?'active':'')+'" onclick="go(\'products\')">▦ <span>产品库</span></button>'+(role==='admin'||role==='selector'?'<button class="'+(view==='upload'?'active':'')+'" onclick="go(\'upload\')">＋ <span>上传产品</span></button>':'')+'<button class="'+(view==='sales'?'active':'')+'" onclick="go(\'sales\')">◈ <span>销售端</span></button></div><div class="logout"><button class="nav button" onclick="db.auth.signOut()">退出登录</button></div></aside><main class="main"><header class="top"><div class="muted">LEOMILES / '+esc(view==='products'?'产品库':view==='upload'?'上传产品':view==='detail'?'产品详情':'销售端')+'</div><div class="user"><span>'+esc(role==='selector'?'选品人员':role==='admin'?'管理员':'销售人员')+'</span><div class="avatar">'+esc((user?.email||'L')[0].toUpperCase())+'</div></div></header>'+content+'</main></div>'}
async function loadProducts(){let q=db.from('products').select('*,product_media(*)').order('updated_at',{ascending:false});if(role==='sales')q=q.eq('status','published');const {data,error}=await q;if(error){toast(error.message);return[]}products=data||[];return products}
function firstMedia(p){return (p.product_media||[]).slice().sort((a,b)=>a.sort_order-b.sort_order)[0]||null}
function mediaUrl(m){return m?db.storage.from('product-media').getPublicUrl(m.storage_path).data.publicUrl:null}
function card(p){const media=firstMedia(p);const url=mediaUrl(media);return '<article class="product"><div class="pimg">'+(url?(media.media_type==='video'?'<video src="'+esc(url)+'" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover"></video>':'<img src="'+esc(url)+'">'):'<div class="mock">'+esc(p.sku||'NEW')+'</div>')+'</div><div class="pbody"><span class="tag">● '+esc(p.status==='published'?'已发布':'草稿')+'</span><h3>'+esc(p.name)+'</h3><p>'+esc((p.description||'').slice(0,70))+'</p><div class="row"><span class="price">'+money(p.suggested_price??p.purchase_price)+'</span><button class="more" onclick="openDetail(\''+p.id+'\')">查看详情 →</button></div></div></article>'}
async function productsPage(){const list=await loadProducts();shell('<div class="page"><div class="head"><div><h2>产品库</h2><p class="muted">产品资料统一管理，发布后自动同步销售端。</p></div>'+(role==='admin'||role==='selector'?'<button class="btn dark" onclick="go(\'upload\')">＋ 上传产品</button>':'')+'</div><div class="toolbar"><div class="search"><input placeholder="搜索产品名称、编号、关键词……" oninput="filter(this.value)"></div><div class="chips"><button class="chip active">全部</button><button class="chip">3C数码</button><button class="chip">小家电</button><button class="chip">美容健康</button></div></div><div id="grid" class="grid">'+(list.length?list.map(card).join(''):'<div class="empty">还没有产品</div>')+'</div></div>')}
function filter(q){const a=products.filter(p=>(p.name+' '+(p.sku||'')+' '+(p.description||'')).toLowerCase().includes(q.toLowerCase()));document.getElementById('grid').innerHTML=a.length?a.map(card).join(''):'<div class="empty">没有找到匹配产品</div>'}
function resetPending(){pendingImages=[];pendingVideos=[]}
function previewImageFiles(files){pendingImages=[...pendingImages,...[...files].filter(f=>f.type.startsWith('image/'))];renderImagePreviews()}
function previewVideoFiles(files){pendingVideos=[...pendingVideos,...[...files].filter(f=>f.type.startsWith('video/'))];renderVideoPreviews()}
function renderImagePreviews(){const el=document.getElementById('imagePreviews');if(!el)return;el.innerHTML=pendingImages.map((f,i)=>'<div class="preview-wrap"><img class="preview" src="'+URL.createObjectURL(f)+'"><button type="button" class="remove-preview" onclick="removeImage('+i+')">×</button></div>').join('')}
function renderVideoPreviews(){const el=document.getElementById('videoPreviews');if(!el)return;el.innerHTML=pendingVideos.map((f,i)=>'<div class="preview-wrap"><video class="preview preview-video" src="'+URL.createObjectURL(f)+'" muted></video><button type="button" class="remove-preview" onclick="removeVideo('+i+')">×</button><div class="video-meta">'+esc(f.name)+'</div></div>').join('')}
function removeImage(i){pendingImages.splice(i,1);renderImagePreviews()}
function removeVideo(i){pendingVideos.splice(i,1);renderVideoPreviews()}
function handleImagePaste(e){if(!document.getElementById('uploadForm'))return;const files=[...e.clipboardData.files].filter(f=>f.type.startsWith('image/'));if(files.length){e.preventDefault();previewImageFiles(files);toast('已粘贴 '+files.length+' 张图片') }}
function bindUploadArea(){const dz=document.getElementById('imageDrop'),vz=document.getElementById('videoDrop');dz.addEventListener('click',()=>document.getElementById('images').click());vz.addEventListener('click',()=>document.getElementById('videos').click());for(const zone of [dz,vz]){zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag')});zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');if(zone===dz)previewImageFiles(e.dataTransfer.files);else previewVideoFiles(e.dataTransfer.files)})}document.getElementById('images').addEventListener('change',e=>previewImageFiles(e.target.files));document.getElementById('videos').addEventListener('change',e=>previewVideoFiles(e.target.files));document.addEventListener('paste',handleImagePaste,{once:true});}
function uploadPage(){resetPending();shell('<div class="page upload"><div class="head"><div><h2>上传产品</h2><p class="muted">建立一次产品档案，图片和视频都会进入同一个产品资料库。</p></div></div><form id="uploadForm" onsubmit="saveProduct(event)"><div class="section"><h3>基本信息</h3><div class="two"><div class="field"><label>产品名称</label><input id="pname" required placeholder="例如：L291 筋膜枪"></div><div class="field"><label>产品编号</label><input id="sku" placeholder="例如：L291"></div></div><div class="field"><label>产品分类</label><select id="category"><option>美容健康</option><option>3C数码</option><option>小家电</option><option>户外</option><option>其他</option></select></div><div class="field"><label>产品简介</label><textarea id="desc" placeholder="产品定位、使用场景、核心介绍"></textarea></div></div><div class="section"><h3>产品图片</h3><div id="imageDrop" class="drop"><strong>⌘＋V / ＋</strong><div>点击选择或直接粘贴产品图片</div><small>支持 JPG / PNG / WEBP，也支持拖拽；可一次粘贴多张图片</small><input id="images" type="file" accept="image/*" multiple style="display:none"></div><div id="imagePreviews" class="previews"></div><div class="hint">提示：复制微信、浏览器、截图工具中的图片后，直接在此页面按 <b>Ctrl + V</b> 即可加入。</div></div><div class="section"><h3>产品视频</h3><div id="videoDrop" class="drop"><strong>▶＋</strong><div>点击选择或拖拽产品视频</div><small>支持浏览器常见视频格式；建议单个视频控制在合理大小，便于上传和销售端播放</small><input id="videos" type="file" accept="video/*" multiple style="display:none"></div><div id="videoPreviews" class="previews"></div><div class="hint">视频会上传到 Supabase Storage，并与当前产品绑定。发布后销售端可直接播放。</div></div><div class="section"><h3>核心卖点</h3><div id="highlights"><div class="field"><input class="highlight" placeholder="卖点 1"></div><div class="field"><input class="highlight" placeholder="卖点 2"></div><div class="field"><input class="highlight" placeholder="卖点 3"></div></div></div><div class="section"><h3>价格与供应</h3><div class="two"><div class="field"><label>采购价</label><input id="purchase" type="number" step="0.01" placeholder="0.00"></div><div class="field"><label>建议销售价</label><input id="suggested" type="number" step="0.01" placeholder="0.00"></div><div class="field"><label>MOQ</label><input id="moq" type="number" min="0" placeholder="0"></div><div class="field"><label>供应商</label><input id="supplier" placeholder="供应商名称"></div></div><div class="field"><label>内部备注</label><textarea id="notes" placeholder="仅管理员和选品人员可见"></textarea></div></div><div class="actions"><button type="button" class="btn" onclick="go('products')">取消</button><button class="btn dark">保存并发布</button></div></form></div>');bindUploadArea()}
async function saveProduct(e){e.preventDefault();if(role!=='admin'&&role!=='selector')return toast('当前账号没有上传权限');const btn=e.submitter;btn.disabled=true;btn.textContent='正在保存…';try{const highlights=[...document.querySelectorAll('.highlight')].map(x=>x.value.trim()).filter(Boolean);const payload={name:document.getElementById('pname').value.trim(),sku:document.getElementById('sku').value.trim()||null,category:document.getElementById('category').value,description:document.getElementById('desc').value.trim()||null,highlights,purchase_price:document.getElementById('purchase').value===''?null:Number(document.getElementById('purchase').value),suggested_price:document.getElementById('suggested').value===''?null:Number(document.getElementById('suggested').value),moq:document.getElementById('moq').value===''?null:Number(document.getElementById('moq').value),supplier:document.getElementById('supplier').value.trim()||null,internal_notes:document.getElementById('notes').value.trim()||null,status:'published',created_by:user.id,updated_by:user.id};const {data:p,error}=await db.from('products').insert(payload).select().single();if(error)throw error;let sort=0;for(const file of pendingImages){const path=user.id+'/'+p.id+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^\w.\-]+/g,'_');const up=await db.storage.from('product-media').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;const ins=await db.from('product_media').insert({product_id:p.id,storage_path:path,media_type:'image',sort_order:sort++});if(ins.error)throw ins.error}for(const file of pendingVideos){const path=user.id+'/'+p.id+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^\w.\-]+/g,'_');const up=await db.storage.from('product-media').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;const ins=await db.from('product_media').insert({product_id:p.id,storage_path:path,media_type:'video',sort_order:sort++});if(ins.error)throw ins.error}toast('产品已保存并发布');resetPending();await openDetail(p.id)}catch(err){console.error(err);toast(err.message||'保存失败')}finally{btn.disabled=false;btn.textContent='保存并发布'}}
function productMedia(p){return (p.product_media||[]).slice().sort((a,b)=>a.sort_order-b.sort_order)}
function openDetail(id){const p=products.find(x=>x.id===id);if(p){selected=p;view='detail';detailPage(p);return}db.from('products').select('*,product_media(*)').eq('id',id).single().then(({data,error})=>{if(error)return toast(error.message);selected=data;view='detail';detailPage(data)})}
function detailPage(p){const media=productMedia(p);const images=media.filter(m=>m.media_type==='image');const videos=media.filter(m=>m.media_type==='video');let current=media[0]||null;const hero=current?renderHeroMedia(current):'<div class="mock">'+esc(p.sku||'NEW')+'</div>';let publicSales=role==='sales';const bullets=(p.highlights||[]).map(h=>'<li>'+esc(h)+'</li>').join('');const specRows=[['分类',p.category],['SKU',p.sku],['MOQ',p.moq],['建议售价',money(p.suggested_price)]];if(!publicSales)specRows.push(['采购价',money(p.purchase_price)],['供应商',p.supplier]);shell('<div class="page"><button class="btn" onclick="go(\'products\')">← 返回产品库</button><div class="detail" style="margin-top:22px"><div><div id="hero" class="hero">'+hero+'</div><div class="media-nav" style="margin-top:12px">'+media.map((m,i)=>'<button onclick="showMedia('+i+')">'+(m.media_type==='video'?'视频 ':'图片 ')+(i+1)+'</button>').join('')+'</div></div><div><span class="tag">● '+esc(p.status==='published'?'已发布':'草稿')+'</span><h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.description||'')+'</p><ul class="bullets">'+bullets+'</ul><div class="spec-grid">'+specRows.map(r=>'<div><small>'+esc(r[0])+'</small><b>'+esc(r[1]??'—')+'</b></div>').join('')+'</div></div></div></div>');window.currentDetailMedia=media}
function renderHeroMedia(m){const url=mediaUrl(m);return m.media_type==='video'?'<video controls playsinline preload="metadata" src="'+esc(url)+'"></video>':'<img src="'+esc(url)+'" alt="产品图片">'}
function showMedia(i){const m=window.currentDetailMedia?.[i];if(m)document.getElementById('hero').innerHTML=renderHeroMedia(m)}
async function salesPage(){const list=await loadProducts();shell('<div class="page"><div class="saleshero"><h2>销售端</h2><p>这里只展示已发布的产品、卖点、参数、销售价格以及产品素材。</p></div><div class="grid">'+(list.length?list.map(card).join(''):'<div class="empty">暂无已发布产品</div>')+'</div></div>')}
function go(v){view=v;if(v==='products')productsPage();else if(v==='upload')uploadPage();else if(v==='sales')salesPage()}
function render(){if(view==='products')productsPage();else if(view==='upload')uploadPage();else if(view==='detail'&&selected)detailPage(selected);else salesPage()}
init();
</script>
</body></html>
