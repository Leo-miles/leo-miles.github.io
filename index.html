<head>

<style>
:root{--bg:#07101c;--panel:#0d1827;--panel2:#111f31;--line:#26384f;--text:#f7f9fc;--muted:#93a1b5;--gold:#d8b66d;--ok:#55d88b;--danger:#ff6b6b;--r:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#18304b 0,#07101c 40%);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1380px;margin:auto;padding:0 22px}.top{position:sticky;top:0;z-index:20;background:#07101cdd;backdrop-filter:blur(16px);border-bottom:1px solid #16263a}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:18px}.brand span{color:var(--gold)}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:#111d2d;color:var(--text);padding:10px 14px;border-radius:11px}.btn.primary{background:#f1e5c8;color:#1a2028;border-color:#f1e5c8;font-weight:800}.btn:hover{border-color:#536a86}.hero{padding:52px 0 24px}.eyebrow{font-size:12px;color:var(--gold);letter-spacing:2px;font-weight:800}.hero h1{font-size:clamp(38px,6vw,72px);line-height:1.02;margin:14px 0}.hero p{max-width:760px;color:var(--muted);font-size:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.stat,.card,.modal-card{background:linear-gradient(180deg,#0f1a2a,#0b1624);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 40px #0003}.stat{padding:18px}.stat b{display:block;font-size:28px;margin-top:4px}.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;padding:18px 0 60px}.side{position:sticky;top:88px;align-self:start}.side-title{color:var(--muted);font-size:12px;margin-bottom:9px}.cat-list{display:grid;gap:5px;max-height:72vh;overflow:auto;padding-right:4px}.cat{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 12px;border-radius:11px;text-align:left}.cat:hover,.cat.active{color:var(--text);background:#102039;border-color:#223953}.cat small{opacity:.7}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.search{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0a1523;color:var(--text);outline:none}.search:focus,.field:focus,.ta:focus,select:focus{border-color:#587492}.count{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{overflow:hidden;cursor:pointer}.thumb{aspect-ratio:1.35;background:#0a1421;display:flex;align-items:center;justify-content:center;color:#5e6d82}.thumb img{width:100%;height:100%;object-fit:cover}.product-body{padding:14px}.tag{display:inline-flex;border:1px solid #334a63;border-radius:999px;padding:3px 8px;font-size:11px;color:#bfcbda}.product h3{margin:9px 0 3px;font-size:17px}.meta,.muted{color:var(--muted)}.price{margin-top:9px;font-weight:800;font-size:16px}.empty{padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}.adminbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;padding:14px;border:1px solid #2c4059;border-radius:15px;background:#0c1827}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}.modal-card{width:min(100%,980px);max-height:93vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px}.close{border:0;background:transparent;color:var(--muted);font-size:26px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.field-wrap label{display:block;color:#c9d3df;font-size:12px;margin-bottom:6px}.field,.ta,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#091321;color:var(--text);outline:none}.ta{min-height:100px;resize:vertical}.section{margin-top:18px;padding-top:18px;border-top:1px solid #1a2c40}.section h4{margin:0 0 10px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px}.point-row{display:grid;grid-template-columns:34px 1fr 44px;gap:8px}.num{display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.media{position:relative;aspect-ratio:1;border:1px solid var(--line);background:#091321;border-radius:12px;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:cover}.media button{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:#0009;color:white}.drop{margin-top:10px;padding:24px;border:1px dashed #405878;border-radius:14px;text-align:center;color:var(--muted)}.drop.drag{border-color:var(--gold);background:#132236}.toast{position:fixed;right:18px;bottom:18px;z-index:80;max-width:430px;padding:13px 16px;border-radius:12px;background:#102039;border:1px solid #3b5573;box-shadow:0 12px 30px #0008}.toast.ok{border-color:#2b7a52}.toast.err{border-color:#91404b}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}.kv div{background:#0a1523;border:1px solid #1b2d41;border-radius:11px;padding:10px}.kv small{display:block;color:var(--muted)}.detail-media{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-top:16px}.detail-main{aspect-ratio:1.25;background:#091321;border-radius:14px;overflow:hidden}.detail-main img{width:100%;height:100%;object-fit:cover}.detail-side{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:340px;overflow:auto}.detail-side div{aspect-ratio:1;background:#091321;border:1px solid var(--line);border-radius:10px;overflow:hidden}.detail-side img,.detail-side video{width:100%;height:100%;object-fit:cover}.points{padding-left:20px}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:9px;border-bottom:1px solid #1b2b3e;text-align:left}.notice{padding:10px 12px;border:1px solid #624f29;border-radius:10px;background:#1b180f;color:#ddca9c;margin-bottom:12px}@media(max-width:980px){.layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.detail-media{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:0 14px}.hero{padding-top:38px}.hero h1{font-size:42px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.actions .ghost{display:none}.row{grid-template-columns:1fr}.media-grid{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr}}
</style>

<body>
<header class="top"><div class="wrap nav"><div class="brand">LeoMiles <span>· Product Intelligence</span></div><div class="actions"><button class="btn ghost" id="loginBtn">登录</button><button class="btn primary hidden" id="newBtn">＋ 新建产品</button><button class="btn hidden" id="adminBtn">后台</button><button class="btn ghost hidden" id="logoutBtn">退出</button></div></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">PRODUCT INTELLIGENCE HUB</div><h1>产品资料，统一沉淀。</h1><p>产品、成本、参数、卖点、图片、视频和协作记录集中管理。选择分类后，录入对应资料；只有“充电宝”分类才会出现电芯和套料成本字段。</p><div class="stats"><div class="stat"><span class="muted">产品</span><b id="sProducts">0</b></div><div class="stat"><span class="muted">分类</span><b id="sCats">0</b></div><div class="stat"><span class="muted">素材</span><b id="sMedia">0</b></div><div class="stat"><span class="muted">身份</span><b id="sRole">访客</b></div></div></section>
<section class="layout"><aside class="side"><div class="side-title">产品分类</div><div id="cats" class="cat-list"></div></aside><section><div id="adminbar" class="adminbar hidden"><div><b>内容管理</b><div class="muted">管理员可以新增、编辑产品并上传素材。</div></div><button class="btn primary" id="newBtn2">＋ 新建产品</button></div><div class="toolbar"><input id="search" class="search" placeholder="搜索产品名、型号、供应商、参数、卖点…"><span id="count" class="count"></span></div><div id="grid" class="grid"></div></section></section>
</main>
<div id="modal"></div><div id="toast"></div>
<script>
const URL='https://zzkujghfxbjafvmlkwqz.supabase.co',KEY='sb_publishable_LYoWqn32khuKfipDWW40MQ_ggoW0FGf';
const sb=window.supabase.createClient(URL,KEY);
const state={user:null,profile:null,role:'user',categories:[],products:[],media:[],cat:'all',q:'',draft:[],editId:null};
const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin=()=>['admin','superadmin'].includes(state.role); const roleText=()=>state.role==='superadmin'?'超级管理员':state.role==='admin'?'管理员':'普通用户';
function toast(t,type='ok'){const e=document.createElement('div');e.className='toast '+type;e.textContent=t;$('#toast').appendChild(e);setTimeout(()=>e.remove(),3600)}
function cat(id){return state.categories.find(c=>c.id===id)}; function catName(id){return cat(id)?.name||'未分类'};
function imgUrl(path){return sb.storage.from('product-media').getPublicUrl(path).data.publicUrl}
async function load(){const [c,p,m]=await Promise.all([sb.from('categories').select('*').order('sort_order'),sb.from('products').select('*').order('updated_at',{ascending:false}),sb.from('product_media').select('*').order('sort_order')]);if(c.error)toast('分类读取失败：'+c.error.message,'err');if(p.error)toast('产品读取失败：'+p.error.message,'err');state.categories=c.data||[];state.products=p.data||[];state.media=m.data||[];render();stats();const {data:{session}}=await sb.auth.getSession();if(session)await hydrate(session.user);sb.auth.onAuthStateChange(async(e,s)=>{if(e==='SIGNED_IN'&&s?.user)await hydrate(s.user);if(e==='SIGNED_OUT'){state.user=null;state.profile=null;state.role='user';header();render();stats()}})}
async function hydrate(u){state.user=u;const {data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).single();if(error){state.role='user';toast('登录成功，但账号角色读取失败：'+error.message,'err')}else{state.profile=p;state.role=p?.role||'user'}header();render();stats()}
function header(){const on=!!state.user;$('#loginBtn').classList.toggle('hidden',on);$('#logoutBtn').classList.toggle('hidden',!on);$('#newBtn').classList.toggle('hidden',!isAdmin());$('#adminBtn').classList.toggle('hidden',!isAdmin());$('#adminbar').classList.toggle('hidden',!isAdmin());$('#sRole').textContent=on?roleText():'访客'}
function stats(){$('#sProducts').textContent=state.products.length;$('#sCats').textContent=state.categories.length;$('#sMedia').textContent=state.media.length}
function renderCats(){const a=[{id:'all',name:'全部产品',sort_order:0},...state.categories];$('#cats').innerHTML=a.map(c=>`<button class="cat ${state.cat===c.id?'active':''}" data-cat="${c.id}"><span>${esc(c.name)}</span><small>${c.id==='all'?state.products.length:state.products.filter(p=>p.category_id===c.id).length}</small></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render()})}
function render(){renderCats();const list=state.products.filter(p=>{const text=[p.name,p.model,p.supplier,p.description,JSON.stringify(p.parameters),JSON.stringify(p.selling_points)].join(' ').toLowerCase();return(!state.q||text.includes(state.q.toLowerCase()))&&(state.cat==='all'||p.category_id===state.cat)});$('#count').textContent=`${list.length} 个产品`;$('#grid').innerHTML=list.length?list.map(p=>{const m=state.media.filter(x=>x.product_id===p.id&&x.media_type==='image').sort((a,b)=>a.sort_order-b.sort_order)[0];return `<article class="card product" data-id="${p.id}"><div class="thumb">${m?`<img src="${esc(imgUrl(m.storage_path))}" alt="">`:'暂无图片'}</div><div class="product-body"><span class="tag">${esc(catName(p.category_id))}</span><h3>${esc(p.name)}</h3><div class="meta">${esc(p.model||'未填写型号')} · ${esc(p.supplier||'未填写供应商')}</div><div class="price">${p.price!=null?'¥'+Number(p.price).toFixed(2):'价格待补充'}</div></div></article>`}).join(''):'<div class="empty">没有找到匹配产品。<br>换一个关键词或切换分类试试。</div>';document.querySelectorAll('.product').forEach(e=>e.onclick=()=>detail(e.dataset.id))}
$('#search').oninput=e=>{state.q=e.target.value.trim();render()};$('#loginBtn').onclick=login;$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();toast('已退出登录')};$('#newBtn').onclick=()=>editor();$('#newBtn2').onclick=()=>editor();$('#adminBtn').onclick=admin;
function openModal(html){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card">${html}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
function login(){openModal(`<div class="modal-head"><div><h2>登录产品智库</h2><div class="muted">账号可填写 leo、user1 等账号名，也可填写完整邮箱。</div></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid" style="margin-top:16px"><div class="field-wrap full"><label>账号</label><input id="la" class="field" autocomplete="username" placeholder="leo / user1 / 邮箱"></div><div class="field-wrap full"><label>密码</label><input id="lp" class="field" type="password" autocomplete="current-password"></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn primary" onclick="doLogin()">登录</button></div>`) }
function acc(a){return a.includes('@')?a:a+'@accounts.leo-product-center.invalid'} async function doLogin(){const a=$('#la').value.trim(),p=$('#lp').value;if(!a||!p)return toast('账号和密码都要填写','err');const {error}=await sb.auth.signInWithPassword({email:acc(a),password:p});if(error)return toast('登录失败：'+error.message,'err');closeModal();toast('登录成功')}
function editor(id=null){if(!isAdmin())return toast('需要管理员权限','err');state.editId=id;state.draft=[];const p=id?state.products.find(x=>x.id===id):null;const params=Object.entries(p?.parameters||{}).map(([k,v])=>`<div class="row"><input class="field pk" value="${esc(k)}" placeholder="参数名"><input class="field pv" value="${esc(v)}" placeholder="参数值"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`).join('')||`<div class="row"><input class="field pk" placeholder="参数名"><input class="field pv" placeholder="参数值"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`;const points=(p?.selling_points||['']).map(v=>`<div class="point-row"><span class="num">•</span><input class="field sell" value="${esc(v)}"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`).join('');openModal(`<div class="modal-head"><div><h2>${p?'编辑产品':'新建产品'}</h2><div class="muted">选择分类后，页面会自动决定是否显示充电宝专属成本。</div></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid" style="margin-top:16px"><div class="field-wrap"><label>产品名称 *</label><input id="name" class="field" value="${esc(p?.name)}"></div><div class="field-wrap"><label>型号</label><input id="model" class="field" value="${esc(p?.model)}"></div><div class="field-wrap"><label>分类 *</label><select id="fcat">${state.categories.map(c=>`<option value="${c.id}" ${p?.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field-wrap"><label>供应商</label><input id="supplier" class="field" value="${esc(p?.supplier)}"></div><div class="field-wrap"><label>价格</label><input id="price" class="field" type="number" step="0.01" value="${p?.price??''}"></div><div class="field-wrap"><label>MOQ</label><input id="moq" class="field" type="number" value="${p?.moq??''}"></div><div class="field-wrap"><label>交期</label><input id="delivery" class="field" value="${esc(p?.delivery)}"></div><div class="field-wrap"><label>包装 / 装箱</label><input id="carton" class="field" value="${esc(p?.carton)}"></div><div class="field-wrap full"><label>产品说明</label><textarea id="desc" class="ta">${esc(p?.description)}</textarea></div></div><div class="section"><h4>自定义参数</h4><div id="params" class="rows">${params}</div><button class="btn" style="margin-top:8px" onclick="addParam()">＋ 添加参数</button></div><div class="section"><h4>卖点</h4><div id="points" class="rows">${points}</div><button class="btn" style="margin-top:8px" onclick="addPoint()">＋ 添加卖点</button></div><div id="pb" class="section hidden"><h4>充电宝专属资料</h4><div class="notice">只有选择“充电宝”分类时显示；其他分类完全不会出现这些字段。</div><div class="form-grid"><div class="field-wrap"><label>电芯型号</label><input id="cell_model" class="field" value="${esc(p?.cell_model)}"></div><div class="field-wrap"><label>电芯数量</label><input id="cell_count" class="field" type="number" value="${p?.cell_count??''}"></div><div class="field-wrap"><label>实际容量 mAh</label><input id="capacity" class="field" type="number" value="${p?.actual_cell_capacity??''}"></div><div class="field-wrap"><label>单颗电芯价格</label><input id="cell_price" class="field" type="number" step="0.01" value="${p?.cell_price??''}"></div><div class="field-wrap"><label>组装费</label><input id="assembly" class="field" type="number" step="0.01" value="${p?.assembly_fee??''}"></div><div class="field-wrap"><label>其他成本</label><input id="other" class="field" type="number" step="0.01" value="${p?.other_cost??''}"></div><div class="field-wrap"><label>套装价</label><input id="kit" class="field" type="number" step="0.01" value="${p?.kit_price??''}"></div><div class="field-wrap"><label>总成本（自动）</label><input id="total" class="field" readonly value="${p?.total_cost??''}"></div></div></div><div class="section"><h4>图片 / 视频</h4><div id="mediaGrid" class="media-grid">${id?state.media.filter(m=>m.product_id===id).sort((a,b)=>a.sort_order-b.sort_order).map(mediaHtml).join(''):''}</div><div id="drop" class="drop">拖拽图片/视频到这里，或点击选择文件；也支持 Ctrl+V 粘贴图片<input id="file" type="file" accept="image/*,video/*" multiple hidden></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="save()">保存产品</button></div>`);bindEditor();togglePB();calcTotal()}
function mediaHtml(m,pending=false){const u=pending?m.preview:imgUrl(m.storage_path);return `<div class="media" data-mid="${m.id}">${m.media_type==='video'?`<video src="${esc(u)}" controls></video>`:`<img src="${esc(u)}" alt="">`}<button onclick="removeMedia('${m.id}',${pending})">×</button></div>`}
function bindEditor(){const s=$('#fcat');s.addEventListener('change',togglePB);['cell_price','cell_count','assembly','other'].forEach(id=>$('#'+id)?.addEventListener('input',calcTotal));const d=$('#drop'),f=$('#file');d.onclick=e=>{if(e.target!==f)f.click()};f.onchange=()=>files(f.files);d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');files(e.dataTransfer.files)};window.onpaste=e=>{if(!$('#file'))return;files([...e.clipboardData.files].filter(x=>x.type.startsWith('image/')))}}
function files(fs){[...fs].forEach(file=>{if(!/^(image|video)\//.test(file.type))return;const o={id:crypto.randomUUID(),file,preview:URL.createObjectURL(file),media_type:file.type.startsWith('video/')?'video':'image'};state.draft.push(o);$('#mediaGrid').insertAdjacentHTML('beforeend',mediaHtml(o,true))})}
function removeMedia(id,pending){if(pending)state.draft=state.draft.filter(x=>x.id!==id);document.querySelector(`[data-mid="${id}"]`)?.remove()}
function isPB(){const c=cat($('#fcat').value);return c?.slug==='powerbank'} function togglePB(){const on=isPB();$('#pb').classList.toggle('hidden',!on);if(!on){['cell_model','cell_count','capacity','cell_price','assembly','other','kit','total'].forEach(id=>{const e=$('#'+id);if(e)e.value=''})}} function calcTotal(){const n=Number($('#cell_price')?.value)*Number($('#cell_count')?.value)+Number($('#assembly')?.value)+Number($('#other')?.value);if($('#total'))$('#total').value=Number.isFinite(n)?n.toFixed(2):''}
function addParam(){const d=document.createElement('div');d.className='row';d.innerHTML='<input class="field pk" placeholder="参数名"><input class="field pv" placeholder="参数值"><button class="btn" onclick="this.parentElement.remove()">×</button>';$('#params').appendChild(d)}function addPoint(){const d=document.createElement('div');d.className='point-row';d.innerHTML='<span class="num">•</span><input class="field sell"><button class="btn" onclick="this.parentElement.remove()">×</button>';$('#points').appendChild(d)}
function dataFromForm(){const params={};document.querySelectorAll('#params .row').forEach(r=>{const k=r.querySelector('.pk').value.trim(),v=r.querySelector('.pv').value.trim();if(k)params[k]=v});const selling=[...document.querySelectorAll('#points .sell')].map(x=>x.value.trim()).filter(Boolean);const pb=isPB();const cp=Number($('#cell_price').value),cc=Number($('#cell_count').value),a=Number($('#assembly').value),o=Number($('#other').value);return {name:$('#name').value.trim(),model:$('#model').value.trim()||null,category_id:$('#fcat').value,supplier:$('#supplier').value.trim()||null,price:$('#price').value===''?null:Number($('#price').value),moq:$('#moq').value===''?null:Number($('#moq').value),delivery:$('#delivery').value.trim()||null,carton:$('#carton').value.trim()||null,description:$('#desc').value.trim()||null,parameters:params,selling_points:selling,published:true,kit_price:pb&&$('#kit').value!==''?Number($('#kit').value):null,cell_model:pb?($('#cell_model').value.trim()||null):null,cell_count:pb&&$('#cell_count').value!==''?Number($('#cell_count').value):null,actual_cell_capacity:pb&&$('#capacity').value!==''?Number($('#capacity').value):null,cell_price:pb&&$('#cell_price').value!==''?cp:null,assembly_fee:pb&&$('#assembly').value!==''?a:null,other_cost:pb&&$('#other').value!==''?o:null,total_cost:pb?(Number.isFinite(cp*cc+a+o)?cp*cc+a+o:null):null,updated_at:new Date().toISOString()}}
async function save(){if(!isAdmin())return toast('需要管理员权限','err');const d=dataFromForm();if(!d.name)return toast('产品名称必填','err');let id=state.editId;if(id){const {error}=await sb.from('products').update(d).eq('id',id);if(error)return toast('保存失败：'+error.message,'err')}else{const {data,error}=await sb.from('products').insert({...d,created_by:state.user.id}).select().single();if(error)return toast('创建失败：'+error.message,'err');id=data.id}const base=state.media.filter(m=>m.product_id===id).length;for(let i=0;i<state.draft.length;i++){const m=state.draft[i],path=`${id}/${Date.now()}-${i}-${m.file.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,'_')}`;const up=await sb.storage.from('product-media').upload(path,m.file);if(up.error)return toast('媒体上传失败：'+up.error.message,'err');const ins=await sb.from('product_media').insert({product_id:id,media_type:m.media_type,storage_path:path,sort_order:base+i});if(ins.error)return toast('媒体记录失败：'+ins.error.message,'err')}state.draft=[];await loadData();closeModal();toast('产品保存成功')}
async function loadData(){const [p,m]=await Promise.all([sb.from('products').select('*').order('updated_at',{ascending:false}),sb.from('product_media').select('*').order('sort_order')]);state.products=p.data||[];state.media=m.data||[];render();stats()}
function detail(id){const p=state.products.find(x=>x.id===id);if(!p)return;const ms=state.media.filter(m=>m.product_id===id).sort((a,b)=>a.sort_order-b.sort_order),im=ms.find(m=>m.media_type==='image');openModal(`<div class="modal-head"><div><span class="tag">${esc(catName(p.category_id))}</span><h2 style="margin:8px 0 0">${esc(p.name)}</h2><div class="muted">${esc(p.model||'')} · ${esc(p.supplier||'')}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="detail-media"><div class="detail-main">${im?`<img src="${esc(imgUrl(im.storage_path))}" alt="">`:'<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#607089">暂无图片</div>'}</div><div class="detail-side">${ms.map(m=>`<div>${m.media_type==='video'?`<video src="${esc(imgUrl(m.storage_path))}" controls></video>`:`<img src="${esc(imgUrl(m.storage_path))}" alt="">`}</div>`).join('')}</div></div><div class="kv"><div><small>价格</small>${p.price==null?'—':'¥'+Number(p.price).toFixed(2)}</div><div><small>MOQ</small>${p.moq??'—'}</div><div><small>交期</small>${esc(p.delivery||'—')}</div><div><small>包装</small>${esc(p.carton||'—')}</div></div><div class="section"><h4>参数</h4>${Object.entries(p.parameters||{}).map(([k,v])=>`<div>${esc(k)}：${esc(v)}</div>`).join('')||'<span class="muted">暂无</span>'}</div><div class="section"><h4>卖点</h4><ol class="points">${(p.selling_points||[]).map(v=>`<li>${esc(v)}</li>`).join('')||'<li>暂无</li>'}</ol></div>${p.total_cost!=null?`<div class="section"><h4>充电宝成本</h4><div class="kv"><div><small>电芯型号</small>${esc(p.cell_model||'—')}</div><div><small>电芯数量</small>${p.cell_count??'—'}</div><div><small>实际容量</small>${p.actual_cell_capacity??'—'} mAh</div><div><small>电芯单价</small>${p.cell_price??'—'}</div><div><small>组装费</small>${p.assembly_fee??'—'}</div><div><small>其他成本</small>${p.other_cost??'—'}</div><div><small>套装价</small>${p.kit_price??'—'}</div><div><small>总成本</small>¥${Number(p.total_cost).toFixed(2)}</div></div></div>`:''}<div class="section"><button class="btn primary" onclick="copyFull('${p.id}')">一键复制完整产品信息</button>${isAdmin()?` <button class="btn" onclick="editor('${p.id}')">编辑</button>`:''}</div>`)}
async function copyFull(id){const p=state.products.find(x=>x.id===id);const c=catName(p.category_id);const t=[`产品名称：${p.name}`,`型号：${p.model||''}`,`分类：${c}`,`供应商：${p.supplier||''}`,`价格：${p.price??''}`,`MOQ：${p.moq??''}`,`交期：${p.delivery||''}`,`包装/装箱：${p.carton||''}`,'参数：',...Object.entries(p.parameters||{}).map(([k,v])=>`- ${k}：${v}`),'卖点：',...(p.selling_points||[]).map((v,i)=>`${i+1}. ${v}`),...(p.total_cost!=null?[`电芯型号：${p.cell_model||''}`,`电芯数量：${p.cell_count??''}`,`实际容量：${p.actual_cell_capacity??''} mAh`,`电芯单价：${p.cell_price??''}`,`组装费：${p.assembly_fee??''}`,`其他成本：${p.other_cost??''}`,`套装价：${p.kit_price??''}`,`总成本：${p.total_cost}`]:[])].join('\n');try{await navigator.clipboard.writeText(t);toast('完整产品信息已复制')}catch(e){toast('复制失败，请检查浏览器剪贴板权限','err')}}
function admin(){if(!isAdmin())return;openModal(`<div class="modal-head"><div><h2>管理后台</h2><div class="muted">${roleText()} · ${esc(state.profile?.display_name||state.profile?.username||'')}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section"><h4>用户</h4><div id="users">加载中…</div></div>`);loadUsers()}
async function loadUsers(){const {data,error}=await sb.from('profiles').select('id,username,display_name,role,muted').order('created_at');$('#users').innerHTML=error?`<div class="danger">${esc(error.message)}</div>`:`<div style="overflow:auto"><table class="admin-table"><tr><th>账号</th><th>显示名</th><th>角色</th><th>状态</th></tr>${(data||[]).map(u=>`<tr><td>${esc(u.username||'')}</td><td>${esc(u.display_name||'')}</td><td>${esc(u.role)}</td><td>${u.muted?'已禁言':'正常'}</td></tr>`).join('')}</table></div>`}
load().catch(e=>toast('初始化失败：'+e.message,'err'));
</script></body></html>
